    else st.active = win;
    return ev;
  },
  auto(st, rng) {
    if (st.done || !st.dealDone) return [];
    st.dealDone = false;
    const ev = [];
    for (const team of [0, 1]) {
      const members = st.seats.filter((s) => this.team(s) === team);
      let bid = 0, took = 0, delta = 0;
      for (const s of members) {
        const b = st.bids[s] || 0, t = st.tricks[s] || 0;
        if (b === 0) {
          // Nil scores on its own; its tricks do not help the contract.
          delta += t === 0 ? 100 : -100;
          if (t === 0) { st.nils[s] = (st.nils[s] || 0) + 1; ev.push(`${st.names[s]} made nil.`); }
          took += t;
        } else { bid += b; took += t; }
      }
      if (bid > 0) {
        if (took >= bid) {
          const over = took - bid;
          delta += bid * 10 + over;
          st.bags[team] += over;
          if (st.bags[team] >= 10) { st.bags[team] -= 10; delta -= 100; ev.push(`Team ${team + 1} bagged out.`); }
        } else delta -= bid * 10;
      }
      st.teamScore[team] += delta;
    }
    ev.push("Hand scored.");
    if (st.teamScore[0] >= st.target || st.teamScore[1] >= st.target) {
      const winTeam = st.teamScore[0] === st.teamScore[1] ? null : (st.teamScore[0] > st.teamScore[1] ? 0 : 1);
      const scores = {}; st.seats.forEach((s) => { scores[s] = st.teamScore[this.team(s)]; });
      st.done = { winners: winTeam === null ? [] : st.seats.filter((s) => this.team(s) === winTeam), scores, lowWins: false };
      return ev;
    }
    st.round++; st.dealer = nextSeat(st.seats, st.dealer); this.deal(st, rng);
    ev.push(`Deal ${st.round}.`);
    return ev;
  },
  observe(st, seat) {
    return { hand: B.cardsIn(st.board, Z.hand(seat)), bids: st.bids, led: st.led,
      plays: st.plays.map((p) => ({ seat: p.seat, card: st.board.cards.get(p.id) })),
      broken: st.broken, tricks: st.tricks, partner: (seat + 2) % 4, teamScore: st.teamScore };
  },
  agent(st, seat, legal, prof, rng) {
    if (st.phase === "bid") {
      const hand = B.cardsIn(st.board, Z.hand(seat));
      const spades = hand.filter((c) => c.suit === "S");
      let est = spades.filter((c) => c.rank >= 12).length + Math.max(0, spades.length - 3);
      est += hand.filter((c) => c.suit !== "S" && c.rank === 14).length;
      est += hand.filter((c) => c.suit !== "S" && c.rank === 13).length * 0.5;
      est = Math.round(est * (0.85 + prof.aggression * 0.35));
      const n = Math.max(0, Math.min(13, est));
      const bidNil = n <= 1 && !spades.some((c) => c.rank >= 12) && rng.chance(prof.risk * .5);
      const want = bidNil ? 0 : Math.max(1, n);
      return legal.find((a) => a.n === want) || legal[Math.min(want, legal.length - 1)];
    }
    const o = this.observe(st, seat);
    const partnerWinning = o.plays.length && Trick.winner(st.plays, st.board.cards, o.led, "S") === o.partner;
    const scored = legal.map((a) => {
      const c = st.board.cards.get(a.id);
      const myBid = st.bids[seat] || 0, myTricks = st.tricks[seat] || 0;
      const wantTricks = myBid === 0 ? -1 : myBid - myTricks;
      let v = 0;
      if (!o.plays.length) v = wantTricks > 0 ? c.rank * .6 : -c.rank * .6;
      else {
        const best = Trick.winner(st.plays.concat([{ seat, id: a.id }]), st.board.cards, o.led, "S");
        const wins = best === seat;
        v = wins ? (wantTricks > 0 ? 25 : -25) : (wantTricks > 0 ? -4 : 8);
        if (partnerWinning && wins) v -= 12;                 // do not steal from your partner
        v -= c.suit === "S" && wantTricks <= 0 ? c.rank * .4 : 0;
      }
      return { action: a, score: v + rng() * 3 * prof.risk };
    });
    return choose(scored, prof, rng);
  },
  table(st, viewer) {
    const co = [];
    if (st.phase === "bid") co.push({ k: "Bidding", v: `${Object.keys(st.bids).length} of 4 in` });
    else co.push({ k: "Trick", v: `${st.trickNo} of 13` }, { k: "Spades", v: st.broken ? "Broken" : "Not broken" });
    co.push({ k: "Us / Them", v: `${st.teamScore[0]} · ${st.teamScore[1]}` });
    if (st.led) co.push({ k: "Led", v: SUIT_GLYPH[st.led] });
    return {
      callouts: co,
      zones: [{ label: "Trick", cards: st.plays.map((p) => B.visible(st.board, p.id, viewer)), spread: true }],
      counts: (s) => `${B.count(st.board, Z.hand(s))}${st.bids[s] !== undefined ? ` · ${st.tricks[s] || 0}/${st.bids[s]}` : ""}`,
      handHint: st.phase === "bid" ? "How many tricks will you take?" : null,
    };
  },
});

/* ── EUCHRE ───────────────────────────────────────────────────────── */
def({
  id: "euchre", name: "Euchre", tagline: "Bowers, partners, and going alone.",
  category: "Trick taking", min: 4, max: 4, teams: true, art: ["forest", "ink"],
  setup(cfg, rng) {
    const seats = [0, 1, 2, 3];
    const st = { seats, board: newBoard(), done: null, phase: "bid1", dealer: 0, active: 1,
      upcard: null, trump: null, maker: null, alone: null, passes: 0, plays: [], led: null,
      tricks: {}, teamScore: { 0: 0, 1: 0 }, round: 1, target: 10, dealDone: false, trickNo: 1 };
    this.deal(st, rng);
    return st;
  },
  team(seat) { return seat % 2; },
  partner(seat) { return (seat + 2) % 4; },
  sameColour(suit) { return { H: "D", D: "H", S: "C", C: "S" }[suit]; },
  /* The left bower counts as trump. This is the rule people forget. */
  effSuit(card, trump) {
    if (trump && card.rank === 11 && card.suit === this.sameColour(trump)) return trump;
    return card.suit;
  },
  trumpValue(card, trump) {
    if (card.rank === 11 && card.suit === trump) return 100;
    if (card.rank === 11 && card.suit === this.sameColour(trump)) return 99;
    return card.suit === trump ? card.rank : 0;
  },
  deal(st, rng) {
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck({ ranks: [9, 10, 11, 12, 13, 14] })), Z.stock);
    B.ensure(b, [...st.seats.map(Z.hand), ...st.seats.map(Z.captured), Z.trick, Z.reserve, Z.discard]);
    for (let i = 0; i < 5; i++) for (const s of st.seats) B.draw(b, Z.stock, Z.hand(s), "own", s);
    for (const s of st.seats) B.sort(b, Z.hand(s), bySuitRank);
    const up = B.draw(b, Z.stock, Z.reserve, "up");
    st.board = b; st.upcard = up ? up.id : null; st.trump = null; st.maker = null;
    st.alone = null; st.passes = 0; st.phase = "bid1"; st.plays = []; st.led = null;
    st.trickNo = 1; st.tricks = {}; st.seats.forEach((s) => { st.tricks[s] = 0; });
    st.active = nextSeat(st.seats, st.dealer);
  },
  inPlay(st) { return st.seats.filter((s) => s !== st.alone); },
  nextIn(st, from) { let s = from; for (let i = 0; i < 4; i++) { s = nextSeat(st.seats, s); if (s !== st.alone) return s; } return from; },
  legalCards(st, seat) {
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (!st.plays.length || !st.led) return hand;
    const follow = hand.filter((c) => this.effSuit(c, st.trump) === st.led);
    return follow.length ? follow : hand;
  },
  legal(st, seat) {
    if (st.done || st.active !== seat) return [];
    if (st.phase === "bid1") {
      const out = [{ t: "orderUp", alone: false }, { t: "orderUp", alone: true }, { t: "passBid" }];
      return out;
    }
    if (st.phase === "bid2") {
      const turned = st.board.cards.get(st.upcard);
      const out = [];
      for (const suit of SUITS) if (!turned || suit !== turned.suit) {
        out.push({ t: "callTrump", suit, alone: false });
        out.push({ t: "callTrump", suit, alone: true });
      }
      if (seat !== st.dealer) out.push({ t: "passBid" });     // the dealer is stuck
      return out;
    }
    if (st.phase === "discard") return B.cardsIn(st.board, Z.hand(seat)).map((c) => ({ t: "discard", id: c.id }));
    if (st.phase !== "play") return [];
    return this.legalCards(st, seat).map((c) => ({ t: "play", id: c.id }));
  },
  apply(st, a, rng) {
    const seat = st.active, ev = [];
    if (a.t === "orderUp") {
      const up = st.board.cards.get(st.upcard);
      st.trump = up.suit; st.maker = seat;
      if (a.alone) { st.alone = this.partner(seat); ev.push(`${st.names[seat]} goes alone.`); }
      B.move(st.board, st.upcard, Z.hand(st.dealer), "own", st.dealer);
      B.sort(st.board, Z.hand(st.dealer), bySuitRank);
      st.phase = "discard"; st.active = st.dealer;
      ev.push(`${st.names[seat]} orders up ${SUIT_NAME[st.trump].toLowerCase()}.`);
      return ev;
    }
    if (a.t === "callTrump") {
      st.trump = a.suit; st.maker = seat;
      if (a.alone) { st.alone = this.partner(seat); ev.push(`${st.names[seat]} goes alone.`); }
      st.phase = "play"; st.active = this.nextIn(st, st.dealer);
      ev.push(`${st.names[seat]} calls ${SUIT_NAME[a.suit].toLowerCase()}.`);
      return ev;
    }
    if (a.t === "passBid") {
      st.passes++;
      if (st.phase === "bid1" && st.passes >= 4) {
        st.phase = "bid2"; st.passes = 0;
        if (st.upcard) B.face(st.board, st.upcard, "down");
        st.active = nextSeat(st.seats, st.dealer);
      } else st.active = nextSeat(st.seats, seat);
      return ev;
    }
    if (a.t === "discard") {
      B.move(st.board, a.id, Z.discard, "down");
      st.phase = "play"; st.active = this.nextIn(st, st.dealer);
      return ev;
    }
    const card = st.board.cards.get(a.id);
    B.move(st.board, a.id, Z.trick, "up");
    st.plays.push({ seat, id: a.id });
    if (st.plays.length === 1) st.led = this.effSuit(card, st.trump);
    if (st.plays.length < this.inPlay(st).length) { st.active = this.nextIn(st, seat); return ev; }
    const win = Trick.winner(st.plays, st.board.cards, st.led, st.trump,
      (c) => (this.effSuit(c, st.trump) === st.trump ? this.trumpValue(c, st.trump) : c.rank));
    st.tricks[win] = (st.tricks[win] || 0) + 1;
    B.move(st.board, st.plays.map((p) => p.id), Z.captured(win), "up");
    ev.push(`${st.names[win]} takes it.`);
    st.plays = []; st.led = null; st.trickNo++;
    if (this.inPlay(st).every((x) => !B.count(st.board, Z.hand(x)))) { st.phase = "score"; st.active = null; st.dealDone = true; }
    else st.active = win;
    return ev;
  },
  auto(st, rng) {
    if (st.done || !st.dealDone) return [];
    st.dealDone = false;
    const ev = [];
    const mk = this.team(st.maker);
    const made = st.seats.filter((s) => this.team(s) === mk).reduce((n, s) => n + (st.tricks[s] || 0), 0);
    let points = 0, to = mk;
    if (made >= 3) {
      points = made === 5 ? (st.alone !== null ? 4 : 2) : 1;
      if (made === 5) { st.marches = (st.marches || 0) + 1; if (st.alone !== null) st.loners = (st.loners || 0) + 1; }
      ev.push(made === 5 ? `${st.names[st.maker]}'s team march.` : `${st.names[st.maker]}'s team make it.`);
    } else { points = 2; to = 1 - mk; st.euchres = (st.euchres || 0) + 1; ev.push("Euchred!"); }
    st.teamScore[to] += points;
    if (st.teamScore[0] >= st.target || st.teamScore[1] >= st.target) {
      const winTeam = st.teamScore[0] > st.teamScore[1] ? 0 : 1;
      const scores = {}; st.seats.forEach((s) => { scores[s] = st.teamScore[this.team(s)]; });
      st.done = { winners: st.seats.filter((s) => this.team(s) === winTeam), scores, lowWins: false };
      return ev;
    }
    st.round++; st.dealer = nextSeat(st.seats, st.dealer); this.deal(st, rng);
    ev.push(`Deal ${st.round}.`);
    return ev;
  },
  observe(st, seat) {
    return { hand: B.cardsIn(st.board, Z.hand(seat)), trump: st.trump, led: st.led,
      upcard: st.upcard ? st.board.cards.get(st.upcard) : null, maker: st.maker,
      plays: st.plays.map((p) => ({ seat: p.seat, card: st.board.cards.get(p.id) })),
      tricks: st.tricks, teamScore: st.teamScore, partner: this.partner(seat) };
  },
  agent(st, seat, legal, prof, rng) {
    const hand = B.cardsIn(st.board, Z.hand(seat));
    const strength = (trump) => hand.reduce((n, c) => n + (this.effSuit(c, trump) === trump ? this.trumpValue(c, trump) / 12 : (c.rank === 14 ? 1.2 : 0)), 0);
    if (st.phase === "bid1") {
      const up = st.board.cards.get(st.upcard);
      const s = strength(up.suit) + (seat === st.dealer ? .8 : 0);
      const bar = 5.2 - prof.aggression * 1.6;
      if (s >= bar + 2.4 && rng.chance(prof.risk * .5)) return legal.find((a) => a.t === "orderUp" && a.alone);
      if (s >= bar) return legal.find((a) => a.t === "orderUp" && !a.alone);
      return legal.find((a) => a.t === "passBid") || legal[0];
    }
    if (st.phase === "bid2") {
      let best = null;
      for (const a of legal) if (a.t === "callTrump" && !a.alone) {
        const s = strength(a.suit);
        if (!best || s > best.s) best = { a, s };
      }
      const bar = 5.0 - prof.aggression * 1.6;
      if (best && (best.s >= bar || !legal.some((a) => a.t === "passBid"))) return best.a;
      return legal.find((a) => a.t === "passBid") || (best && best.a) || legal[0];
    }
    if (st.phase === "discard") {
      const worst = hand.filter((c) => this.effSuit(c, st.trump) !== st.trump).sort((a, b) => a.rank - b.rank)[0] || hand[0];
      return legal.find((a) => a.id === worst.id) || legal[0];
    }
    const o = this.observe(st, seat);
    const partnerWinning = o.plays.length && Trick.winner(st.plays, st.board.cards, o.led, st.trump,
      (c) => (this.effSuit(c, st.trump) === st.trump ? this.trumpValue(c, st.trump) : c.rank)) === o.partner;
    const scored = legal.map((a) => {
      const c = st.board.cards.get(a.id);
      const val = this.effSuit(c, st.trump) === st.trump ? this.trumpValue(c, st.trump) : c.rank;
      let v;
      if (!o.plays.length) v = val * .5;
      else {
        const wins = Trick.winner(st.plays.concat([{ seat, id: a.id }]), st.board.cards, o.led, st.trump,
          (x) => (this.effSuit(x, st.trump) === st.trump ? this.trumpValue(x, st.trump) : x.rank)) === seat;
        v = wins ? 20 - val * .1 : -val * .3;
        if (partnerWinning && wins) v -= 14;
      }
      return { action: a, score: v + rng() * 2 * prof.risk };
    });
    return choose(scored, prof, rng);
  },
  table(st, viewer) {
    const up = st.upcard ? st.board.cards.get(st.upcard) : null;
    const co = [{ k: "Us / Them", v: `${st.teamScore[0]} · ${st.teamScore[1]}` }];
    if (st.trump) co.push({ k: "Trump", v: SUIT_GLYPH[st.trump] + " " + SUIT_NAME[st.trump] });
    else if (up) co.push({ k: "Turned up", v: RANK_TOKEN[up.rank] + SUIT_GLYPH[up.suit] });
    if (st.phase === "play") co.push({ k: "Trick", v: `${st.trickNo} of 5` });
    if (st.alone !== null) co.push({ k: "Alone", v: st.names[this.partner(st.alone)] });
    const zones = [{ label: "Trick", cards: st.plays.map((p) => B.visible(st.board, p.id, viewer)), spread: true }];
    if (st.phase === "bid1" && st.upcard) zones.unshift({ label: "Up", cards: [B.visible(st.board, st.upcard, viewer)] });
    return {
      callouts: co, zones,
      counts: (s) => (s === st.alone ? "sitting out" : `${B.count(st.board, Z.hand(s))} · ${st.tricks[s] || 0}`),
      handHint: st.phase === "discard" ? "Throw one away" : null,
    };
  },
});

/* ── SPEED ────────────────────────────────────────────────────────── */
def({
  id: "speed", name: "Speed", tagline: "No turns. Just be quicker.",
  category: "Speed", min: 2, max: 2, art: ["coral", "ink"],
  centre(i) { return `centre:${i}`; },
  setup(cfg, rng) {
    const seats = [0, 1];
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck()), Z.stock);
    B.ensure(b, [...seats.map(Z.hand), ...seats.map((s) => Z.own("draw", s)), ...seats.map((s) => Z.own("res", s)), this.centre(0), this.centre(1), Z.stock]);
    for (const s of seats) for (let i = 0; i < 5; i++) B.draw(b, Z.stock, Z.own("res", s), "down");
    for (const s of seats) for (let i = 0; i < 5; i++) B.draw(b, Z.stock, Z.hand(s), "own", s);
    let i = 0;
    while (B.count(b, Z.stock)) { B.draw(b, Z.stock, Z.own("draw", seats[i % 2]), "down"); i++; }
    for (const s of seats) B.sort(b, Z.hand(s), byRankSuit);
    const st = { seats, board: b, done: null, active: null, played: { 0: 0, 1: 0 }, flips: 1, moves: 0 };
    seats.forEach((s, k) => { const top = B.at(b, Z.own("res", s)).slice(-1)[0]; if (top !== undefined) B.move(b, top, this.centre(k), "up"); });
    return st;
  },
  /* One rank above or below, with the ace joining both ends. */
  playable(card, top) {
    if (!top) return false;
    if (Math.abs(card.rank - top.rank) === 1) return true;
    return Math.abs(aceLow(card.rank) - aceLow(top.rank)) === 1;
  },
  remaining(st, s) { return B.count(st.board, Z.hand(s)) + B.count(st.board, Z.own("draw", s)); },
  stuck(st) {
    for (const s of st.seats) for (const c of B.cardsIn(st.board, Z.hand(s)))
      for (let p = 0; p < 2; p++) if (this.playable(c, B.top(st.board, this.centre(p)))) return false;
    return true;
  },
  canFlip(st) { return st.seats.every((s) => B.count(st.board, Z.own("res", s)) > 0); },
  legal(st, seat) {
    if (st.done) return [];
    const out = [];
    for (const c of B.cardsIn(st.board, Z.hand(seat)))
      for (let p = 0; p < 2; p++) if (this.playable(c, B.top(st.board, this.centre(p)))) out.push({ t: "play", id: c.id, pile: p });
    if (!out.length && this.stuck(st) && this.canFlip(st)) out.push({ t: "flip" });
    return out;
  },
  apply(st, a, rng) {
    const ev = [];
    const seat = st.seats.find((s) => B.at(st.board, Z.hand(s)).includes(a.id));
    if (a.t === "flip") {
      st.flips++;
      st.seats.forEach((s, k) => { const top = B.at(st.board, Z.own("res", s)).slice(-1)[0]; if (top !== undefined) B.move(st.board, top, this.centre(k), "up"); });
      ev.push("New cards down.");
    } else {
      B.move(st.board, a.id, this.centre(a.pile), "up");
      st.played[seat]++; st.moves++;
      while (B.count(st.board, Z.hand(seat)) < 5 && B.count(st.board, Z.own("draw", seat)) > 0)
        B.draw(st.board, Z.own("draw", seat), Z.hand(seat), "own", seat);
      B.sort(st.board, Z.hand(seat), byRankSuit);
      if (this.remaining(st, seat) === 0) { st.done = this.finish(st, seat); ev.push(`${st.names[seat]} is out.`); return ev; }
    }
    if (this.stuck(st) && !this.canFlip(st)) {
      const rank = [...st.seats].sort((x, y) => this.remaining(st, x) - this.remaining(st, y));
      st.done = this.finish(st, rank[0]);
      ev.push("Nobody can move and there is nothing to turn.");
    }
    return ev;
  },
  finish(st, winner) {
    const scores = {}; st.seats.forEach((s) => { scores[s] = 52 - this.remaining(st, s); });
    return { winners: [winner], scores, lowWins: false };
  },
  observe(st, seat) {
    return { hand: B.cardsIn(st.board, Z.hand(seat)),
      centres: [0, 1].map((p) => B.top(st.board, this.centre(p))),
      draw: B.count(st.board, Z.own("draw", seat)), opponent: this.remaining(st, seat === 0 ? 1 : 0) };
  },
  agent(st, seat, legal, prof, rng) {
    // Prefer a card that keeps the most follow-ups open.
    const scored = legal.map((a) => {
      if (a.t === "flip") return { action: a, score: 0 };
      const c = st.board.cards.get(a.id);
      const rest = B.cardsIn(st.board, Z.hand(seat)).filter((x) => x.id !== a.id);
      const follows = rest.filter((x) => this.playable(x, c)).length;
      return { action: a, score: follows * 6 + rng() * 2 };
    });
    return choose(scored, prof, rng);
  },
  table(st, viewer) {
    return {
      callouts: [{ k: "Left", v: viewer === null ? "—" : this.remaining(st, viewer) },
        { k: "Turns down", v: st.flips }],
      zones: [
        { label: "", cards: [B.top(st.board, this.centre(0))].filter(Boolean).map((c) => ({ known: true, ...c })) },
        { label: "", cards: [B.top(st.board, this.centre(1))].filter(Boolean).map((c) => ({ known: true, ...c })) },
      ],
      counts: (s) => `${this.remaining(st, s)}`,
      handHint: "Play onto either pile — one rank up or down",
      dimUnplayable: (c) => ![0, 1].some((p) => this.playable(c, B.top(st.board, this.centre(p)))),
    };
  },
});

/* ── FREECELL (solo) ──────────────────────────────────────────────── */
def({
  id: "freecell", name: "FreeCell", tagline: "Everything is visible. That is the hard part.",
  category: "Solitaire", min: 1, max: 1, solo: true, art: ["acid", "ink"],
  cell(i) { return `cell:${i}`; },
  setup(cfg, rng) {
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck()), Z.stock);
    B.ensure(b, [...Array(8).keys()].map(Z.tableau)
      .concat([...Array(4).keys()].map(Z.foundation), [...Array(4).keys()].map(this.cell), [Z.stock]));
    let col = 0;
    while (B.count(b, Z.stock)) { B.draw(b, Z.stock, Z.tableau(col % 8), "up"); col++; }
    return { board: b, seats: [0], active: 0, done: null, moves: 0, pick: null };
  },
  freeCells(st) { return [0, 1, 2, 3].filter((i) => !B.count(st.board, this.cell(i))).length; },
  emptyCols(st) { return [...Array(8).keys()].filter((i) => !B.count(st.board, Z.tableau(i))).length; },
  /* The classic formula: (free cells + 1) x 2^(empty columns), halved when
     the destination is itself an empty column. */
  lift(st, toEmpty) { return (this.freeCells(st) + 1) * Math.pow(2, Math.max(0, this.emptyCols(st) - (toEmpty ? 1 : 0))); },
  canFoundation(st, c, f) {
    const top = B.top(st.board, Z.foundation(f));
    return top ? top.suit === c.suit && c.rank === top.rank + 1 : c.rank === 14;
  },
  canTableau(st, c, col) {
    const top = B.top(st.board, Z.tableau(col));
    return top ? isRed(top) !== isRed(c) && c.rank === top.rank - 1 : true;
  },
  run(st, id) {
    const z = B.zoneOf(st.board, id);
    if (!z || !z.startsWith("tab:")) return B.top(st.board, z) && B.top(st.board, z).id === id ? [id] : null;
    const pile = B.at(st.board, z), i = pile.indexOf(id);
    if (i < 0) return null;
    const run = pile.slice(i);
    for (let k = 1; k < run.length; k++) {
      const a = st.board.cards.get(run[k - 1]), c = st.board.cards.get(run[k]);
      if (isRed(a) === isRed(c) || c.rank !== a.rank - 1) return null;
    }
    return run;
  },
  legal(st) {
    if (st.done) return [];
    const out = [], sources = [];
    for (let i = 0; i < 4; i++) { const t = B.top(st.board, this.cell(i)); if (t) sources.push(t); }
    for (let col = 0; col < 8; col++) for (const id of B.at(st.board, Z.tableau(col))) sources.push(st.board.cards.get(id));
    for (const c of sources) {
      const run = this.run(st, c.id);
      if (!run) continue;
      if (run.length === 1) {
        for (let f = 0; f < 4; f++) if (this.canFoundation(st, c, f)) out.push({ t: "move", id: c.id, to: Z.foundation(f) });
        for (let i = 0; i < 4; i++) if (!B.count(st.board, this.cell(i)) && B.zoneOf(st.board, c.id) !== this.cell(i)) out.push({ t: "move", id: c.id, to: this.cell(i) });
      }
      for (let col = 0; col < 8; col++) {
        if (B.zoneOf(st.board, c.id) === Z.tableau(col)) continue;
        if (!this.canTableau(st, c, col)) continue;
        if (run.length > this.lift(st, !B.count(st.board, Z.tableau(col)))) continue;
        out.push({ t: "move", id: c.id, to: Z.tableau(col) });
      }
    }
    return out;
  },
  apply(st, a) {
    const ev = [];
    const run = this.run(st, a.id) || [a.id];
    B.move(st.board, run, a.to, "up");
    st.moves++;
    const home = [0, 1, 2, 3].reduce((n, f) => n + B.count(st.board, Z.foundation(f)), 0);
    if (home === 52) { st.done = { winners: [0], scores: { 0: Math.max(0, 1000 - st.moves * 2) }, lowWins: false }; ev.push("Solved."); }
    return ev;
  },
  observe() { return {}; },
  agent(st, seat, legal) { return legal[0] || null; },
  table(st) {
    const zones = [];
    for (let i = 0; i < 4; i++) zones.push({ label: i === 0 ? "Cells" : "", cell: i, small: true,
      cards: [B.top(st.board, this.cell(i))].filter(Boolean).map((c) => ({ known: true, ...c })) });
    for (let f = 0; f < 4; f++) zones.push({ label: f === 0 ? "Home" : "", foundation: f, small: true,
      cards: [B.top(st.board, Z.foundation(f))].filter(Boolean).map((c) => ({ known: true, ...c })) });
    return {
      callouts: [{ k: "Moves", v: st.moves }, { k: "Free cells", v: this.freeCells(st) },
        { k: "Can move", v: this.lift(st, false) },
        { k: "Home", v: [0,1,2,3].reduce((n, f) => n + B.count(st.board, Z.foundation(f)), 0) + " of 52" }],
      zones, tableau: true, columns: 8, counts: () => "", handHint: null, noCardPlay: true,
    };
  },
});

/* ── SPIDER (solo) ────────────────────────────────────────────────── */
def({
  id: "spider", name: "Spider", tagline: "Ten columns. Eight runs. One suit, or four.",
  category: "Solitaire", min: 1, max: 1, solo: true, art: ["crimson", "ink"],
  setup(cfg, rng) {
    const suits = cfg.suits || 1;
    const packs = suits === 1 ? 8 : suits === 2 ? 4 : 2;
    const use = suits === 1 ? ["S"] : suits === 2 ? ["S", "H"] : SUITS;
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck({ packs, suits: use })), Z.stock);
    B.ensure(b, [...Array(10).keys()].map(Z.tableau).concat([...Array(8).keys()].map(Z.foundation), [Z.stock]));
    for (let col = 0; col < 10; col++) {
      const depth = col < 4 ? 6 : 5;
      for (let r = 0; r < depth; r++) B.draw(b, Z.stock, Z.tableau(col), r === depth - 1 ? "up" : "down");
    }
    return { board: b, seats: [0], active: 0, done: null, moves: 0, runs: 0, suits, pick: null };
  },
  canTableau(st, c, col) {
    const top = B.top(st.board, Z.tableau(col));
    if (!top) return true;
    return st.board.up.has(top.id) && c.rank === top.rank - 1;
  },
  /* Anything sits on one rank higher, but only a same-suit run lifts. */
  run(st, id) {
    const z = B.zoneOf(st.board, id);
    if (!z || !z.startsWith("tab:") || !st.board.up.has(id)) return null;
    const pile = B.at(st.board, z), i = pile.indexOf(id);
    if (i < 0) return null;
    const run = pile.slice(i);
    for (let k = 1; k < run.length; k++) {
      const a = st.board.cards.get(run[k - 1]), c = st.board.cards.get(run[k]);
      if (!st.board.up.has(run[k]) || a.suit !== c.suit || c.rank !== a.rank - 1) return null;
    }
    return run;
  },
  legal(st) {
    if (st.done) return [];
    const out = [];
    for (let col = 0; col < 10; col++) for (const id of B.at(st.board, Z.tableau(col))) {
      if (!st.board.up.has(id)) continue;
      const run = this.run(st, id);
      if (!run) continue;
      const c = st.board.cards.get(id);
      for (let to = 0; to < 10; to++) {
        if (to === col) continue;
        if (this.canTableau(st, c, to)) out.push({ t: "move", id, to: Z.tableau(to) });
      }
    }
    if (B.count(st.board, Z.stock) >= 10 && ![...Array(10).keys()].some((c) => !B.count(st.board, Z.tableau(c))))
      out.push({ t: "deal" });
    return out;
  },
  apply(st, a) {
    const ev = [];
    if (a.t === "deal") {
      for (let col = 0; col < 10; col++) B.draw(st.board, Z.stock, Z.tableau(col), "up");
      st.moves++;
      ev.push("A row down.");
    } else {
      const run = this.run(st, a.id) || [a.id];
      const from = B.zoneOf(st.board, a.id);
      B.move(st.board, run, a.to, "up");
      st.moves++;
      const top = B.top(st.board, from);
      if (top && !st.board.up.has(top.id)) { B.face(st.board, top.id, "up"); ev.push("Turned a card."); }
    }
    ev.push(...this.harvest(st));
    if (st.runs === 8) { st.done = { winners: [0], scores: { 0: Math.max(0, 1200 - st.moves) }, lowWins: false }; ev.push("Solved."); }
    return ev;
  },
  harvest(st) {
    const ev = [];
    for (let col = 0; col < 10; col++) {
      const pile = B.at(st.board, Z.tableau(col));
      if (pile.length < 13) continue;
      const tail = pile.slice(-13);
      const cards = tail.map((id) => st.board.cards.get(id));
      let ok = cards.every((c, i) => st.board.up.has(tail[i]) && c.suit === cards[0].suit && c.rank === 14 - i);
      if (!ok) continue;
      B.move(st.board, tail, Z.foundation(st.runs), "up");
      st.runs++;
      const top = B.top(st.board, Z.tableau(col));
      if (top && !st.board.up.has(top.id)) B.face(st.board, top.id, "up");
      ev.push("A run comes off.");
    }
    return ev;
  },
  observe() { return {}; },
  agent(st, seat, legal) { return legal[0] || null; },
  table(st) {
    const zones = [];
    for (let f = 0; f < 8; f++) zones.push({ label: f === 0 ? "Runs" : "", foundation: f, small: true,
      cards: [B.top(st.board, Z.foundation(f))].filter(Boolean).map((c) => ({ known: true, ...c })) });
    zones.unshift({ label: "Stock", cards: B.count(st.board, Z.stock) ? [{ known: false, id: -21 }] : [], stack: true, action: { t: "deal" } });
    return {
      callouts: [{ k: "Moves", v: st.moves }, { k: "Runs", v: `${st.runs} of 8` },
        { k: "Rows left", v: Math.floor(B.count(st.board, Z.stock) / 10) },
        { k: "Suits", v: st.suits }],
      zones, tableau: true, columns: 10, counts: () => "", handHint: null, noCardPlay: true,
    };
  },
});

/* ── KLONDIKE (solo) ──────────────────────────────────────────────── */
def({
  id: "klondike", name: "Klondike", tagline: "The one everybody means.",
  category: "Solitaire", min: 1, max: 1, solo: true, art: ["forest", "ink"],
  setup(cfg, rng) {
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck()), Z.stock);
    B.ensure(b, [...Array(7).keys()].map(Z.tableau).concat([...Array(4).keys()].map(Z.foundation), [Z.stock, Z.waste]));
    for (let col = 0; col < 7; col++)
      for (let row = 0; row <= col; row++)
        B.draw(b, Z.stock, Z.tableau(col), row === col ? "up" : "down");
    return { board: b, seats: [0], active: 0, done: null, moves: 0, sel: null, redeals: 0 };
  },
  canFoundation(st, c, f) {
    const top = B.top(st.board, Z.foundation(f));
    if (!top) return c.rank === 14;
    return top.suit === c.suit && c.rank === top.rank + 1;
  },
  canTableau(st, c, col) {
    const top = B.top(st.board, Z.tableau(col));
    if (!top) return c.rank === 13;
    return st.board.up.has(top.id) && isRed(top) !== isRed(c) && c.rank === top.rank - 1;
  },
  runFrom(st, id) {
    const z = B.zoneOf(st.board, id);
    if (!z || !z.startsWith("tab:")) return B.top(st.board, z) && B.top(st.board, z).id === id ? [id] : null;
    const pile = B.at(st.board, z), i = pile.indexOf(id);
    if (i < 0 || !st.board.up.has(id)) return null;
    const run = pile.slice(i);
    for (let k = 1; k < run.length; k++) {
      const a = st.board.cards.get(run[k - 1]), c = st.board.cards.get(run[k]);
      if (!st.board.up.has(run[k]) || isRed(a) === isRed(c) || c.rank !== a.rank - 1) return null;
    }
    return run;
  },
  legal(st) {
    if (st.done) return [];
    const out = [];
    const sources = [];
    const w = B.top(st.board, Z.waste); if (w) sources.push(w);
    for (let col = 0; col < 7; col++) for (const id of B.at(st.board, Z.tableau(col))) if (st.board.up.has(id)) sources.push(st.board.cards.get(id));
    for (const c of sources) {
      for (let f = 0; f < 4; f++) if (this.runFrom(st, c.id) && this.runFrom(st, c.id).length === 1 && this.canFoundation(st, c, f)) out.push({ t: "move", id: c.id, to: Z.foundation(f) });
      for (let col = 0; col < 7; col++) if (this.runFrom(st, c.id) && this.canTableau(st, c, col) && B.zoneOf(st.board, c.id) !== Z.tableau(col)) out.push({ t: "move", id: c.id, to: Z.tableau(col) });
    }
    if (B.count(st.board, Z.stock)) out.push({ t: "draw" });
    else if (B.count(st.board, Z.waste)) out.push({ t: "redeal" });
    return out;
  },
  apply(st, a) {
    const ev = [];
    if (a.t === "draw") { B.draw(st.board, Z.stock, Z.waste, "up"); st.moves++; return ev; }
    if (a.t === "redeal") { B.move(st.board, B.at(st.board, Z.waste).slice().reverse(), Z.stock, "down"); st.redeals++; st.moves++; return ev; }
    const run = this.runFrom(st, a.id) || [a.id];
    const from = B.zoneOf(st.board, a.id);
    B.move(st.board, run, a.to, "up");
    st.moves++;
    const nt = B.top(st.board, from);
    if (nt && !st.board.up.has(nt.id)) { B.face(st.board, nt.id, "up"); ev.push("Turned a card."); }
    const home = [0, 1, 2, 3].reduce((n, f) => n + B.count(st.board, Z.foundation(f)), 0);
    if (home === 52) { st.done = { winners: [0], scores: { 0: Math.max(0, 1000 - st.moves * 2) }, lowWins: false }; ev.push("Solved."); }
    return ev;
  },
  observe(st) { return {}; },
  agent(st, seat, legal) { return legal[0] || null; },
  table(st) {
    const zones = [
      { label: "Stock", cards: B.count(st.board, Z.stock) ? [{ known: false, id: -3 }] : [], stack: true, action: B.count(st.board, Z.stock) ? { t: "draw" } : { t: "redeal" } },
      { label: "Waste", cards: [B.top(st.board, Z.waste)].filter(Boolean).map((c) => ({ known: true, ...c })), pick: true },
    ];
    for (let f = 0; f < 4; f++) zones.push({ label: "", cards: [B.top(st.board, Z.foundation(f))].filter(Boolean).map((c) => ({ known: true, ...c })), foundation: f, small: true });
    return {
      callouts: [{ k: "Moves", v: st.moves }, { k: "Home", v: [0,1,2,3].reduce((n, f) => n + B.count(st.board, Z.foundation(f)), 0) + " of 52" }],
      zones, tableau: true, counts: () => "", handHint: null, noCardPlay: true,
    };
  },
});


/* ── RUMMY ────────────────────────────────────────────────────────── */
def({
  id: "rummy", name: "Rummy", tagline: "Build sets. Build runs. Go out clean.",
  category: "Rummy", min: 2, max: 6, art: ["cobalt", "ink"],
  handSize(n) { return n <= 2 ? 10 : n <= 4 ? 7 : 6; },
  setup(cfg, rng) {
    const seats = cfg.seats.map((_, i) => i);
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck()), Z.stock);
    B.ensure(b, [...seats.map(Z.hand), Z.stock, Z.discard]);
    const size = this.handSize(seats.length);
    for (let i = 0; i < size; i++) for (const s of seats) B.draw(b, Z.stock, Z.hand(s), "own", s);
    for (const s of seats) B.sort(b, Z.hand(s), bySuitRank);
    B.draw(b, Z.stock, Z.discard, "up");
    const st = { board: b, seats, active: seats[0], done: null, phase: "draw",
      melds: [], sel: {}, scores: {}, round: 1, target: 100, roundOver: false };
    seats.forEach((s) => { st.scores[s] = 0; });
    return st;
  },
  meldCards(st, m) { return m.cards.map((id) => st.board.cards.get(id)); },
  legal(st, seat) {
    if (st.done || st.active !== seat || st.roundOver) return [];
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const out = [];
      if (B.count(st.board, Z.stock)) out.push({ t: "drawStock" });
      if (B.count(st.board, Z.discard)) out.push({ t: "takeDiscard" });
      return out;
    }
    const picked = st.sel[seat] || [];
    const cards = picked.map((id) => st.board.cards.get(id));
    const out = hand.filter((c) => !picked.includes(c.id)).map((c) => ({ t: "select", id: c.id }));
    if (picked.length) out.push({ t: "clear" });
    if (picked.length >= 3 && Melds.valid(cards)) out.push({ t: "meld" });
    if (picked.length === 1) {
      st.melds.forEach((m, i) => { if (Melds.canLayOff(cards[0], this.meldCards(st, m))) out.push({ t: "layoff", m: i }); });
      out.push({ t: "discard" });
    }
    return out;
  },
  apply(st, a, rng) {
    const seat = st.active, ev = [];
    if (a.t === "drawStock") {
      B.draw(st.board, Z.stock, Z.hand(seat), "own", seat);
      B.sort(st.board, Z.hand(seat), bySuitRank);
      st.phase = "build"; return ev;
    }
    if (a.t === "takeDiscard") {
      const c = B.draw(st.board, Z.discard, Z.hand(seat), "own", seat);
      B.sort(st.board, Z.hand(seat), bySuitRank);
      st.phase = "build";
      if (c) ev.push(`${st.names[seat]} takes the ${RANK_NAME[c.rank].toLowerCase()}.`);
      return ev;
    }
    if (a.t === "select") { st.sel[seat] = [...(st.sel[seat] || []), a.id]; return ev; }
    if (a.t === "clear") { st.sel[seat] = []; return ev; }
    if (a.t === "meld") {
      const ids = st.sel[seat]; st.sel[seat] = [];
      const zone = Z.meld(seat, st.melds.length);
      B.move(st.board, ids, zone, "up");
      st.melds.push({ owner: seat, zone, cards: ids });
      st.meldsLaid = st.meldsLaid || {}; st.meldsLaid[seat] = (st.meldsLaid[seat] || 0) + 1;
      ev.push(`${st.names[seat]} melds ${ids.length}.`);
      return this.checkOut(st, seat, ev);
    }
    if (a.t === "layoff") {
      const id = st.sel[seat][0]; st.sel[seat] = [];
      const m = st.melds[a.m];
      B.move(st.board, id, m.zone, "up");
      m.cards.push(id);
      ev.push(`${st.names[seat]} lays off on ${st.names[m.owner]}'s meld.`);
      return this.checkOut(st, seat, ev);
    }
    // discard
    const id = st.sel[seat][0]; st.sel[seat] = [];
    B.move(st.board, id, Z.discard, "up");
    this.checkOut(st, seat, ev);
    if (st.roundOver) return ev;
    st.phase = "draw";
    st.active = nextSeat(st.seats, seat);
    if (!B.count(st.board, Z.stock)) { st.roundOver = true; st.outSeat = null; ev.push("The stock is out."); }
    return ev;
  },
  checkOut(st, seat, ev) {
    if (B.count(st.board, Z.hand(seat)) > 0) return ev;
    st.roundOver = true; st.outSeat = seat;
    ev.push(`${st.names[seat]} goes out.`);
    return ev;
  },
  auto(st, rng) {
    if (st.done || !st.roundOver) return [];
    st.roundOver = false;
    const ev = [];
    const winner = st.outSeat;
    let total = 0;
    for (const s of st.seats) if (s !== winner) total += B.cardsIn(st.board, Z.hand(s)).reduce((n, c) => n + deadwoodPoints(c), 0);
    if (winner !== null && winner !== undefined) {
      st.scores[winner] += total;
      ev.push(`${st.names[winner]} scores ${total}.`);
    } else ev.push("Nobody went out.");
    if (Math.max(...st.seats.map((s) => st.scores[s])) >= st.target) {
      const best = Math.max(...st.seats.map((s) => st.scores[s]));
      st.done = { winners: st.seats.filter((s) => st.scores[s] === best), scores: { ...st.scores }, lowWins: false };
      return ev;
    }
    st.round++;
    const fresh = this.setup({ seats: st.seats.map(() => ({})) }, rng);
    st.board = fresh.board; st.melds = []; st.sel = {}; st.phase = "draw";
    st.active = st.seats[(st.round - 1) % st.seats.length];
    st.outSeat = null;
    ev.push(`Deal ${st.round}.`);
    return ev;
  },
  observe(st, seat) {
    return { hand: B.cardsIn(st.board, Z.hand(seat)), top: B.top(st.board, Z.discard),
      stock: B.count(st.board, Z.stock), melds: st.melds.map((m) => this.meldCards(st, m)),
      counts: st.seats.map((s) => B.count(st.board, Z.hand(s))) };
  },
  agent(st, seat, legal, prof, rng) {
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const top = B.top(st.board, Z.discard);
      const now = Melds.best(hand).points;
      const withIt = top ? Melds.best(hand.concat(top)).points : Infinity;
      const take = legal.find((a) => a.t === "takeDiscard");
      // Take the upcard only when it actually improves the hand.
      if (take && withIt < now - 2) return take;
      return legal.find((a) => a.t === "drawStock") || take;
    }
    const picked = st.sel[seat] || [];
    const cards = picked.map((id) => st.board.cards.get(id));
    if (picked.length >= 3 && Melds.valid(cards)) return legal.find((a) => a.t === "meld");

    /* Commit to one thing per turn — lay a meld down, or throw a card
       away — and see it through. Deciding afresh on every selection is
       how an agent ends up picking a card up and putting it straight
       back down forever. */
    const solution = Melds.best(hand);
    if (!st.intent || st.intent.seat !== seat || !picked.length) {
      const layable = solution.melds.filter((m) => m.length >= 3);
      st.intent = layable.length && rng.chance(.75 + prof.memory * .2)
        ? { seat, kind: "meld", ids: layable[0].map((c) => c.id) }
        : { seat, kind: "discard", id: (solution.deadwood[0] || hand[hand.length - 1]).id };
    }
    const fallback = () => legal.find((a) => a.t === "clear") || legal.find((a) => a.t === "discard") || legal[0];
    if (st.intent.kind === "meld") {
      const want = st.intent.ids.find((id) => !picked.includes(id));
      if (want !== undefined) return legal.find((a) => a.t === "select" && a.id === want) || fallback();
      return legal.find((a) => a.t === "meld") || fallback();
    }
    if (picked.includes(st.intent.id)) {
      const lay = legal.find((a) => a.t === "layoff");
      if (lay && rng.chance(.6 + prof.memory * .3)) return lay;
      return legal.find((a) => a.t === "discard") || fallback();
    }
    if (picked.length) return legal.find((a) => a.t === "clear") || legal[0];
    return legal.find((a) => a.t === "select" && a.id === st.intent.id) || legal[0];
  },

  table(st, viewer) {
    const zones = [
      { label: "Stock", cards: B.count(st.board, Z.stock) ? [{ known: false, id: -11 }] : [], stack: true },
      { label: "Discard", cards: [B.top(st.board, Z.discard)].filter(Boolean).map((c) => ({ known: true, ...c })) },
    ];
    st.melds.forEach((m, i) => zones.push({
      label: `${st.names[m.owner]} · ${i + 1}`,
      cards: this.meldCards(st, m).map((c) => ({ known: true, ...c })), spread: true, small: true,
    }));
    const mine = viewer === null ? null : Melds.best(B.cardsIn(st.board, Z.hand(viewer)));
    return {
      callouts: [
        { k: "Stock", v: B.count(st.board, Z.stock) },
        { k: "Deal", v: st.round },
        ...(mine ? [{ k: "Your deadwood", v: mine.points }] : []),
      ],
      zones,
      counts: (s) => `${B.count(st.board, Z.hand(s))} · ${st.scores[s]}`,
      handHint: st.phase === "draw" ? "Draw from the stock or take the discard"
        : "Tap cards to select — meld them, lay one off, or discard",
      selected: st.sel[viewer] || [],
    };
  },
});

/* ── GIN RUMMY ────────────────────────────────────────────────────── */
def({
  id: "gin", name: "Gin Rummy", tagline: "Knock low. Or go gin.",
  category: "Rummy", min: 2, max: 2, art: ["acid", "ink"],
  setup(cfg, rng) {
    const seats = [0, 1];
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck()), Z.stock);
    B.ensure(b, [...seats.map(Z.hand), Z.stock, Z.discard]);
    for (let i = 0; i < 10; i++) for (const s of seats) B.draw(b, Z.stock, Z.hand(s), "own", s);
    for (const s of seats) B.sort(b, Z.hand(s), bySuitRank);
    B.draw(b, Z.stock, Z.discard, "up");
    const st = { board: b, seats, active: 1, done: null, phase: "draw", sel: {},
      scores: { 0: 0, 1: 0 }, round: 1, target: 100, knockAt: 10, roundOver: false,
      summary: null, took: null };
    return st;
  },
  legal(st, seat) {
    if (st.done || st.active !== seat || st.roundOver) return [];
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const out = [];
      if (B.count(st.board, Z.stock) > 2) out.push({ t: "drawStock" });
      if (B.count(st.board, Z.discard)) out.push({ t: "takeDiscard" });
      return out;
    }
    const picked = st.sel[seat] || [];
    // The card just taken from the discard cannot go straight back.
    const out = hand.filter((c) => !picked.includes(c.id) && c.id !== st.took)
      .map((c) => ({ t: "select", id: c.id }));
    if (picked.length === 1) {
      out.push({ t: "clear" });
      out.push({ t: "discard" });
      const rest = hand.filter((c) => c.id !== picked[0]);
      const sol = Melds.best(rest);
      if (sol.points <= st.knockAt) out.push({ t: "knock", gin: sol.points === 0 });
    }
    return out;
  },
  apply(st, a, rng) {
    const seat = st.active, ev = [];
    if (a.t === "drawStock") { B.draw(st.board, Z.stock, Z.hand(seat), "own", seat); B.sort(st.board, Z.hand(seat), bySuitRank); st.took = null; st.phase = "discard"; return ev; }
    if (a.t === "takeDiscard") {
      const c = B.draw(st.board, Z.discard, Z.hand(seat), "own", seat);
      B.sort(st.board, Z.hand(seat), bySuitRank);
      st.took = c ? c.id : null; st.phase = "discard";
      if (c) ev.push(`${st.names[seat]} takes the ${RANK_NAME[c.rank].toLowerCase()}.`);
      return ev;
    }
    if (a.t === "select") { st.sel[seat] = [...(st.sel[seat] || []), a.id]; return ev; }
    if (a.t === "clear") { st.sel[seat] = []; return ev; }
    const id = st.sel[seat][0]; st.sel[seat] = [];
    B.move(st.board, id, Z.discard, "up");
    st.took = null;
    if (a.t === "discard") {
      if (B.count(st.board, Z.stock) <= 2) { st.roundOver = true; st.summary = null; ev.push("The stock ran out — washout."); return ev; }
      st.phase = "draw"; st.active = seat === 0 ? 1 : 0;
      return ev;
    }
    // knock
    const other = seat === 0 ? 1 : 0;
    for (const s of st.seats) for (const cid of B.at(st.board, Z.hand(s))) B.face(st.board, cid, "up");
    const mine = Melds.best(B.cardsIn(st.board, Z.hand(seat)));
    let theirs = Melds.best(B.cardsIn(st.board, Z.hand(other)));
    const gin = mine.points === 0;
    let theirPoints = theirs.points;
    if (!gin) {
      // The defender lays off onto the knocker's melds — but not after gin.
      const off = Melds.layOff(theirs.deadwood, mine.melds);
      theirPoints = off.remaining.reduce((n, c) => n + deadwoodPoints(c), 0);
      if (off.laid.length) ev.push(`${st.names[other]} lays off ${off.laid.length}.`);
    }
    const diff = theirPoints - mine.points;
    let winner = seat, points, kind;
    if (gin) { points = theirPoints + 25; kind = "gin"; if (seat === 0) st.ginCount = (st.ginCount || 0) + 1; }
    else if (diff <= 0) { winner = other; points = Math.abs(diff) + 25; kind = "undercut"; if (other === 0) st.undercutCount = (st.undercutCount || 0) + 1; }
    else { points = diff; kind = "knock"; if (seat === 0) st.knockCount = (st.knockCount || 0) + 1; }
    st.scores[winner] += points;
    st.summary = { knocker: seat, winner, points, kind, mine: mine.points, theirs: theirPoints };
    ev.push(kind === "gin" ? `${st.names[seat]} goes gin — ${points}.`
      : kind === "undercut" ? `${st.names[other]} undercuts for ${points}.`
      : `${st.names[seat]} knocks for ${points}.`);
    st.roundOver = true;
    return ev;
  },
  auto(st, rng) {
    if (st.done || !st.roundOver) return [];
    st.roundOver = false;
    const ev = [];
    if (Math.max(st.scores[0], st.scores[1]) >= st.target) {
      const best = Math.max(st.scores[0], st.scores[1]);
      st.done = { winners: st.seats.filter((s) => st.scores[s] === best), scores: { ...st.scores }, lowWins: false };
      return ev;
    }
    st.round++;
    const fresh = this.setup({ seats: [{}, {}] }, rng);
    st.board = fresh.board; st.sel = {}; st.phase = "draw"; st.took = null; st.summary = null;
    st.active = st.round % 2 === 0 ? 0 : 1;
    ev.push(`Deal ${st.round}.`);
    return ev;
  },
  observe(st, seat) {
    const other = seat === 0 ? 1 : 0;
    return { hand: B.cardsIn(st.board, Z.hand(seat)), top: B.top(st.board, Z.discard),
      stock: B.count(st.board, Z.stock), opponent: B.count(st.board, Z.hand(other)), scores: st.scores };
  },
  agent(st, seat, legal, prof, rng) {
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const top = B.top(st.board, Z.discard);
      const now = Melds.best(hand).points;
      const withIt = top ? Melds.best(hand.concat(top)).points : Infinity;
      const take = legal.find((a) => a.t === "takeDiscard");
      if (take && withIt < now - 1) return take;
      return legal.find((a) => a.t === "drawStock") || take;
    }
    const picked = st.sel[seat] || [];
    if (picked.length === 1) {
      const knock = legal.find((a) => a.t === "knock");
      if (knock) {
        // Always take gin. Knock small otherwise, and more readily when
        // the deal has run long.
        if (knock.gin) return knock;
        const rest = Melds.best(hand.filter((c) => c.id !== picked[0])).points;
        if (rest <= 4 || rng.chance(prof.aggression * .5)) return knock;
      }
      return legal.find((a) => a.t === "discard");
    }
    // Choose the discard that leaves the least deadwood.
    let bestId = null, bestPts = Infinity;
    for (const c of hand) {
      if (c.id === st.took) continue;
      const pts = Melds.best(hand.filter((x) => x.id !== c.id)).points;
      if (pts < bestPts) { bestPts = pts; bestId = c.id; }
    }
    return legal.find((a) => a.t === "select" && a.id === bestId) || legal[0];
  },
  table(st, viewer) {
    const mine = viewer === null ? null : Melds.best(B.cardsIn(st.board, Z.hand(viewer)));
    return {
      callouts: [
        { k: "Stock", v: B.count(st.board, Z.stock) },
        { k: "Deal", v: st.round },
        ...(mine ? [{ k: "Deadwood", v: mine.points }, { k: "Knock at", v: st.knockAt + " or less" }] : []),
      ],
      zones: [
        { label: "Stock", cards: B.count(st.board, Z.stock) ? [{ known: false, id: -12 }] : [], stack: true },
        { label: "Discard", cards: [B.top(st.board, Z.discard)].filter(Boolean).map((c) => ({ known: true, ...c })) },
      ],
      counts: (s) => `${B.count(st.board, Z.hand(s))} · ${st.scores[s]}`,
      handHint: st.phase === "draw" ? "Draw from the stock or take the discard"
        : "Tap the card you want to throw",
      selected: st.sel[viewer] || [],
    };
  },
});

/* A game's table description with every function materialised, so it can
   be rendered locally or serialised and sent to another device. */
function tableFor(g, st, viewer) {
  const t = g.table(st, viewer);
  const seat = viewer === null || viewer === undefined ? null : viewer;
  return {
    callouts: t.callouts || [], zones: t.zones || [],
    counts: st.seats.map((s) => (t.counts ? String(t.counts(s)) : "")),
    dimIds: t.dimUnplayable && seat !== null
      ? B.at(st.board, Z.hand(seat)).filter((id) => {
          const c = st.board.cards.get(id);
          return c && t.dimUnplayable(c);
        })
      : [],
    handHint: t.handHint || null, selected: t.selected || [],
    askMode: !!t.askMode, noCardPlay: !!t.noCardPlay, tableau: !!t.tableau,
    columns: t.columns || 0,
  };
}

/* ═══════════════════════════════════════════════════════════════════
   PROGRESSION
   Statistics, achievements, mastery, daily challenges and the seven.
   All of it is data the engine folds; none of it knows any game's rules.
   ═══════════════════════════════════════════════════════════════════ */

/* What each game asks to be counted about it. The engine has no idea what
   a "moon" or a "nil" is; it reads the aggregation and folds the number. */
const METRICS = {

  spades:    [{ k: "nils", t: "Nils made", agg: "sum" }, { k: "bags", t: "Bags collected", agg: "sum" }, { k: "setThem", t: "Contracts set", agg: "sum" }],
  euchre:    [{ k: "marches", t: "Marches", agg: "sum" }, { k: "loners", t: "Loners made", agg: "sum" }, { k: "euchres", t: "Euchres", agg: "sum" }],
  holdem:    [{ k: "biggestPot", t: "Biggest pot", agg: "max" }, { k: "allins", t: "All-ins", agg: "sum" }, { k: "showdowns", t: "Showdowns won", agg: "sum" }],
  gin:       [{ k: "gins", t: "Gins", agg: "sum" }, { k: "undercuts", t: "Undercuts", agg: "sum" }, { k: "knocks", t: "Knocks", agg: "sum" }],

  crazy8:    [{ k: "eights", t: "Eights played", agg: "sum" }],
  cheat:     [{ k: "bluffs", t: "Bluffs that stuck", agg: "sum" }, { k: "caught", t: "Liars caught", agg: "sum" }, { k: "badCalls", t: "Bad calls", agg: "sum" }],
  president: [{ k: "bombs", t: "Bombs dropped", agg: "sum" }, { k: "presidencies", t: "Presidencies", agg: "sum" }],
  gofish:    [{ k: "books", t: "Books made", agg: "sum" }, { k: "luckyDraws", t: "Lucky draws", agg: "sum" }],
  war:       [{ k: "wars", t: "Wars fought", agg: "sum" }, { k: "battles", t: "Battles won", agg: "sum" }],
  speed:     [{ k: "cardsPlayed", t: "Cards played", agg: "sum" }, { k: "flips", t: "Deadlocks broken", agg: "sum" }],
  klondike:  [{ k: "fewestMoves", t: "Fewest moves", agg: "min" }],
  freecell:  [{ k: "fewestMoves", t: "Fewest moves", agg: "min" }],
  spider:    [{ k: "fewestMoves", t: "Fewest moves", agg: "min" }, { k: "suits", t: "Hardest suits beaten", agg: "max" }],
};

/* Each game reports its own numbers at the end. */
function metricsFrom(g, st, seat) {
  const m = {};
  const n = (k, v) => { if (v) m[k] = v; };
  switch (g.id) {
    case "hearts": n("moons", st.points && st.points[seat] === 26 ? 1 : 0); n("queens", st.queensTaken || 0); break;
    case "spades": n("nils", (st.nils || {})[seat] || 0); n("bags", (st.bags || {})[seat % 2] || 0); break;
    case "euchre": n("marches", st.marches || 0); n("loners", st.loners || 0); n("euchres", st.euchres || 0); break;
    case "holdem": n("biggestPot", st.biggestPot || 0); n("allins", st.allinCount || 0); break;
    case "gin": n("gins", st.ginCount || 0); n("undercuts", st.undercutCount || 0); n("knocks", st.knockCount || 0); break;
    case "rummy": n("melds", (st.meldsLaid || {})[seat] || 0); n("goneOut", st.outSeat === seat ? 1 : 0); break;
    case "crazy8": n("eights", st.eightsPlayed || 0); break;
    case "cheat": n("caught", (st.caught || {})[seat] || 0); n("badCalls", (st.badCalls || {})[seat] || 0); break;
    case "president": n("bombs", st.bombs || 0); n("presidencies", st.finish && st.finish[0] === seat ? 1 : 0); break;
    case "gofish": n("books", (st.books || {})[seat] ? st.books[seat].length : 0); break;
    case "war": n("wars", st.wars || 0); break;
    case "speed": n("cardsPlayed", (st.played || {})[seat] || 0); n("flips", st.flips || 0); break;
    case "klondike": case "freecell": if (st.done) n("fewestMoves", st.moves || 0); break;
    case "spider": if (st.done) { n("fewestMoves", st.moves || 0); n("suits", st.suits || 1); } break;
  }
  return m;
}

/* ── The daily challenge ──────────────────────────────────────────── */
const Daily = {
  /* The user's own calendar day. Everything below is a pure function of
     it, so two devices on the same date get the identical challenge. */
  today(now) { const d = now || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; },
  seedFor(dateStr, salt) {
    let h = 2166136261 >>> 0;
    for (const ch of dateStr + "|" + (salt || "")) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  },
  for(dateStr) {
    const pool = Object.values(GAMES).filter((g) => g.id !== "war");
    const pick = rngFrom(this.seedFor(dateStr, "pick"));
    const g = pool[pick.int(pool.length)];
    const r = rngFrom(this.seedFor(dateStr, "spec"));
    const roll = r();
    const scale = 0.5 + Math.pow(roll, 3) * 2.5;              // −50% to +200%, long tail
    const boss = scale > 1.8 || r.chance(0.45) ? BOSSES[rngFrom(this.seedFor(dateStr, "boss")).int(BOSSES.length)] : null;
    const tighten = 1 + (boss ? boss.tighten : 0) / 100;
    const objective = g.solo
      ? (r.chance(.5) ? { kind: "moves", n: Math.max(60, Math.round(200 / (scale * tighten))) }
                      : { kind: "win" })
      : (r.chance(.35) ? { kind: "score", n: Math.max(20, Math.round(90 * scale * tighten)) } : { kind: "win" });
    return {
      date: dateStr, gameId: g.id, gameName: g.name, seed: this.seedFor(dateStr, "deal"),
      scale, percent: Math.round((scale - 1) * 100), bossId: boss ? boss.id : null,
      objective, players: Math.min(g.max, Math.max(g.min, g.solo ? 1 : 4)),
    };
  },
  describe(c) {
    if (c.objective.kind === "win") return "Win it.";
    if (c.objective.kind === "score") return `Score at least ${c.objective.n}.`;
    return `Finish in ${c.objective.n} moves or fewer.`;
  },
  met(c, st, seat) {
    if (!st.done) return false;
    const won = st.done.winners.includes(seat);
    if (c.objective.kind === "win") return won;
    if (c.objective.kind === "score") return (st.done.scores[seat] || 0) >= c.objective.n;
    return won && (st.moves || 0) <= c.objective.n;
  },
};

/* ── Mastery: five bands per game, from what you have actually done ── */
function mastery(profile, gameId) {
  const r = profile.byGame[gameId] || {};
  const wins = r.won || 0;
  let pts = Math.min(4, Math.floor(wins / 3));
  if (r.beatExpert) pts += 2;
  if ((r.dailyWins || 0) > 0) pts += 1;
  const level = pts === 0 ? 0 : pts <= 2 ? 1 : pts <= 4 ? 2 : pts <= 7 ? 3 : 4;
  const bands = [1, 3, 5, 8];
  const prev = level === 0 ? 0 : bands[level - 1];
  const next = level >= 4 ? pts : bands[level];
  return { level, pts, progress: level >= 4 ? 1 : Math.max(0, Math.min(1, (pts - prev) / Math.max(1, next - prev))) };
}
const MASTERY_NAMES = ["Unplayed", "Learning", "Competent", "Strong", "Mastered"];

/* ── The profile ──────────────────────────────────────────────────── */
const Profile = {
  blank(name) {
    return { v: 1, name: name || "Player", created: Date.now(), played: 0, won: 0, lost: 0,
      seconds: 0, byGame: {}, wonGames: [], unlocked: [], bosses: [],
      dailyDone: 0, streak: 0, bestStreak: 0, lastDaily: null, dailyHistory: [] };
  },
  gameRecord(p, id) {
    if (!p.byGame[id]) p.byGame[id] = { played: 0, won: 0, seconds: 0, best: null, metrics: {}, beatExpert: false, dailyWins: 0 };
    return p.byGame[id];
  },
  /* Folds one finished game in. The only place a result becomes history. */
  record(p, { gameId, won, seconds, score, metrics, difficulty, daily, bossId }) {
    p.played++; if (won) p.won++; else p.lost++;
    p.seconds += Math.max(0, Math.round(seconds || 0));
    const r = this.gameRecord(p, gameId);
    r.played++; r.seconds += Math.max(0, Math.round(seconds || 0));
    if (won) {
      r.won++;
      if (!p.wonGames.includes(gameId)) p.wonGames.push(gameId);
      if (difficulty === "expert") r.beatExpert = true;
      if (typeof score === "number" && (r.best === null || score > r.best)) r.best = score;
    }
    for (const [k, v] of Object.entries(metrics || {})) {
      const def = (METRICS[gameId] || []).find((d) => d.k === k);
      const agg = def ? def.agg : "sum";
      const cur = r.metrics[k];
      r.metrics[k] = agg === "max" ? Math.max(cur === undefined ? -Infinity : cur, v)
        : agg === "min" ? Math.min(cur === undefined ? Infinity : cur, v)
        : (cur || 0) + v;
    }
    if (daily && won) {
      r.dailyWins = (r.dailyWins || 0) + 1;
      this.recordDaily(p, daily);
      if (bossId && !p.bosses.includes(bossId)) p.bosses.push(bossId);
    }
    return this.newlyEarned(p);
  },
  /* A day counts once. A streak advances once. Replaying yesterday does
     nothing, which is what stops a streak being farmed. */
  recordDaily(p, dateStr) {
    if (p.dailyHistory.includes(dateStr)) return;
    p.dailyHistory.push(dateStr);
    if (p.dailyHistory.length > 400) p.dailyHistory.shift();
    p.dailyDone++;
    const gap = p.lastDaily ? Math.round((Date.parse(dateStr) - Date.parse(p.lastDaily)) / 86400000) : null;
    p.streak = gap === 1 ? p.streak + 1 : 1;
    p.lastDaily = dateStr;
    if (p.streak > p.bestStreak) p.bestStreak = p.streak;
  },
  expireStreak(p, todayStr) {
    if (!p.lastDaily) return;
    const gap = Math.round((Date.parse(todayStr) - Date.parse(p.lastDaily)) / 86400000);
    if (gap > 1) p.streak = 0;
  },
  earned(p) { return ACHIEVEMENTS.filter((a) => a.of(p) >= a.target).map((a) => a.id); },
  newlyEarned(p) {
    const now = this.earned(p);
    const fresh = now.filter((id) => !p.unlocked.includes(id));
    p.unlocked = now;
    return fresh;
  },
};

/* ═══════════════════════════════════════════════════════════════════
   PRIVACY — the Pass & Play coordinator.
   Permission is state, not a screen. `viewer` is computed and is null
   for every phase where the device is in transit, so there is no code
   path that renders a hand mid-handoff.
   ═══════════════════════════════════════════════════════════════════ */
/* Who the screen belongs to.
 *
 * The viewer is a person, and only ever a person. A computer's turn does
 * not change whose screen this is — nobody hands the phone to a robot —
 * so a computer seat must never become the viewer, or the table would be
 * redacted for the computer and draw its hand face up.
 */
const Privacy = {
  make(seats, isHuman) {
    const humans = seats.filter(isHuman);
    const p = { phase: "open", seat: null, next: null, seats, isHuman, humans };
    /* One person against computers: the device is theirs for the whole
       game, so seat them now and never seal it again. */
    if (humans.length === 1) { p.phase = "playing"; p.seat = humans[0]; }
    return p;
  },
  viewer(p) { return p.phase === "playing" || p.phase === "revealing" ? p.seat : null; },
  acceptsInput(p) { return p.phase === "playing"; },
  open(p, seat) {
    if (p.humans.length <= 1) return "resume";        // already seated, or nobody to seat
    if (!p.isHuman(seat)) return "none";              // a computer opens: show nobody yet
    p.phase = "handoff"; p.next = seat; p.seat = null; return "handoff";
  },
  /* Called when the turn moves. A computer's turn leaves the viewer
     exactly where it was, so the machine plays behind the same redaction
     as any other opponent. The same person twice running is not a handoff
     either — the device has not changed hands. */
  turnMoved(p, seat) {
    if (seat === null || seat === undefined) return "none";
    if (!p.isHuman(seat)) return "none";
    if (p.humans.length === 1) { p.phase = "playing"; p.seat = p.humans[0]; return "none"; }
    if (p.seat === seat && p.phase === "playing") return "none";
    p.phase = "handoff"; p.next = seat; p.seat = null; return "handoff";
  },
  confirm(p) { p.phase = "playing"; p.seat = p.next; p.next = null; },
  /* Putting the phone down mid-turn re-seals it. Alone against computers
     there is nobody to hide from, so a solo game is left alone. */
  shield(p) {
    if (p.humans.length <= 1) return false;
    if (p.phase === "playing" && p.isHuman(p.seat)) { p.next = p.seat; p.seat = null; p.phase = "handoff"; return true; }
    return false;
  },
};

/* ── Talking to the table ────────────────────────────────────────── */
const Net = {
  stream: null,
  async post(path, body) {
    const res = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "The table did not answer.");
    return data;
  },
  open(code, token) {
    Net.close();
    const es = new EventSource(`/api/events?code=${encodeURIComponent(code)}&token=${encodeURIComponent(token)}`);
    es.onmessage = (e) => {
      let view; try { view = JSON.parse(e.data); } catch { return; }
      App.remote = Object.assign(App.remote || {}, { code, token, view });
      if (App.view !== "lobby" && App.view !== "table" && App.view !== "result") App.view = "lobby";
      if (view.phase === "playing" && App.view !== "table") App.view = "table";
      if (view.phase === "over") App.view = "result";
      if (view.phase === "lobby" && App.view !== "lobby") App.view = "lobby";
      render();
    };
    es.onerror = () => { if (App.remote) App.remote.dropped = true; render(); };
    Net.stream = es;
  },
  close() { if (Net.stream) { Net.stream.close(); Net.stream = null; } },
  leave() {
    const r = App.remote;
    Net.close();
    if (r) Net.post("/api/leave", { code: r.code, token: r.token }).catch(() => {});
    App.remote = null; store.set("table", null);
  },
};

/* ── Cover art: a seeded screen-print composition per game ───────── */
/* A press ink as rgba, so it can fade. Falls back to the near-black the
   whole palette is built on if the token is not a plain hex. */
function tint(hex, a) {
  const h = String(hex).trim().replace("#", "");
  const full = h.length === 3 ? h.split("").map((x) => x + x).join("") : h;
  const n = /^[0-9a-fA-F]{6}$/.test(full) ? parseInt(full, 16) : 0x0E0D0C;
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function coverArt(node, game) {
  const c = el("canvas");
  node.prepend(c);
  const paint = () => {
    const r = node.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);
    const g = c.getContext("2d");
    g.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue("--" + game.art[1]).trim() || "#0E0D0C";
    const hue = css.getPropertyValue("--" + game.art[0]).trim() || "#E33A21";
    g.fillStyle = ink; g.fillRect(0, 0, r.width, r.height);
    const rng = rngFrom(game.id.split("").reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7) >>> 0);
    g.fillStyle = hue;
    // A sprayed field, then two overprinted card shapes: press, not gradient.
    for (let i = 0; i < 90; i++) {
      const a = rng() * Math.PI * 2, d = Math.pow(rng(), 1.6) * r.width * .75;
      g.globalAlpha = .10 + rng() * .16;
      g.beginPath();
      g.arc(r.width * .68 + Math.cos(a) * d, r.height * .35 + Math.sin(a) * d * .7, 1 + rng() * 5, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 2; i++) {
      const w = r.width * .32, h = w / (2.5 / 3.5);
      g.save();
      g.translate(r.width * (.68 + i * .12), r.height * (.25 + i * .05));
      g.rotate((i ? 13 : -9) * Math.PI / 180);
      g.fillStyle = i ? hue : css.getPropertyValue("--cream").trim();
      g.globalAlpha = i ? .95 : .18;
      g.beginPath();
      const rr = 6;
      g.roundRect(-w / 2, -h / 2, w, h, rr);
      g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
    /* The title sits on this art, so the art gives it a ground to sit on:
       a block of the same ink deepening under the type, the way a poster
       would print it rather than hoping the word lands on a dark patch. */
    const grad = g.createLinearGradient ? g.createLinearGradient(0, r.height * .34, 0, r.height) : null;
    if (grad && grad.addColorStop) {
      grad.addColorStop(0, tint(ink, 0));
      grad.addColorStop(.55, tint(ink, .74));
      grad.addColorStop(1, tint(ink, .94));
      g.fillStyle = grad;
      g.fillRect(0, r.height * .34, r.width, r.height * .66);
    }
  };
  paint();
  new ResizeObserver(paint).observe(node);
}

  const facts = el("div", "stack");

    const r = el("div", "row");

    r.append(kk, vv); facts.append(r);
  };
  add("Game", g.name);
  add("Objective", Daily.describe(c));
  add("Difficulty", `${c.percent >= 0 ? "+" : ""}${c.percent}%`);
  if (boss) add("What changes", boss.modifier);
  add("Streak", `${p.streak} day${p.streak === 1 ? "" : "s"} · best ${p.bestStreak}`);
  wrap.append(facts);

  /* Everybody who opens today gets this deal. The seed is the date. */
  wrap.append(el("p", "label", "Everyone playing today gets this exact deal."));

  const play = el("button", "btn wide", done ? "Play it again (already counted)" : "Play the challenge");
  play.onclick = () => {
    const cast = [.0, 1, 2, 3, 4, 5].map((i) => CAST[i % CAST.length]);
    const seats = [{ name: p.name || "You", ai: null }];
    for (let i = 1; i < c.players; i++) seats.push({ name: cast[i - 1].name, ai: cast[i - 1].id });
    App.dailyRun = done ? null : c;
    App.game = g;
    startGame(g, seats, c.scale > 1.6 ? "expert" : c.scale > 1.0 ? "skilled" : "casual", c.seed);
    App.dailyRun = null;
  };
  const back = el("button", "btn ghost wide", "Back");
  back.onclick = () => { App.view = "library"; render(); };
  wrap.append(play, back);

  const cal = el("div", "stack");
  cal.style.gap = "var(--s2)";
  cal.append(el("div", "label", "The last two weeks"));
  const strip = el("div", "row");
  strip.style.cssText = "gap:6px;flex-wrap:wrap";
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = Daily.today(d);
    const hit = p.dailyHistory.includes(key);
    const cell = el("div", null, String(d.getDate()));
    cell.style.cssText = `width:34px;height:40px;display:grid;place-items:center;border-radius:6px;font-weight:800;font-size:13px;` +
      (hit ? "background:var(--accent);color:var(--on-accent)" : "background:var(--ground-2);color:var(--on-ground-mute)");
    strip.append(cell);
  }
  cal.append(strip);
  wrap.append(cal);
  s.append(wrap);
  return s;
}

/* ── Running a game ──────────────────────────────────────────────── */
function startGame(g, seats, difficulty, forcedSeed) {
  const seed = forcedSeed !== undefined ? forcedSeed : (Math.random() * 0xFFFFFFFF) >>> 0;
  const rng = rngFrom(seed);
  const state = g.setup({ seats }, rng);
  state.names = seats.map((s) => s.name);
  const isHuman = (i) => !seats[i].ai;
  App.run = {
    g, seed, rng, state, seats, difficulty, started: Date.now(), daily: App.dailyRun || null,
    privacy: Privacy.make(state.seats, isHuman),
    log: [], busy: false, sealArmed: false,
  };
  store.set("myname", seats.find((s) => !s.ai)?.name || "You");
  const first = state.active;
  const mode = Privacy.open(App.run.privacy, first === null || first === undefined ? state.seats[0] : first);
  App.run.sealArmed = mode === "handoff";
  App.view = "table";
  render();
  settle();
}

function profileFor(run, seat) {
  const p = CAST.find((c) => c.id === run.seats[seat].ai) || CAST[0];
  return { ...p, mistake: Math.max(0, p.mistake + DIFFICULTY[run.difficulty]) };
}

function push(run, events) {
  for (const e of events) if (e) run.log.push(e);
  if (run.log.length > 40) run.log.splice(0, run.log.length - 40);
}

/* Runs everything that happens without a person deciding: automatic
   scoring, dealing, AI turns. Stops the moment a human is on the clock. */
function settle() {
  const run = App.run;
  if (!run || run.busy) return;
  const { g, state } = run;
  let guard = 0;
  const step = () => {
    if (!App.run || App.run !== run) return;
    if (state.done) { finishGame(); return; }
    if (guard++ > 4000) return;

    if (g.auto) {
      const ev = g.auto(state, run.rng);
      if (ev.length) { push(run, ev); render(); run.busy = true; setTimeout(() => { run.busy = false; step(); }, 420); return; }
    }
    if (state.done) { finishGame(); return; }

    /* Simultaneous games nominate nobody; anybody holding a move may take
       one, so look for an opponent who can act rather than assuming a seat. */
    let seat = state.active;
    if (seat === null || seat === undefined) {
      seat = state.seats.find((s) => run.seats[s] && run.seats[s].ai && g.legal(state, s).length);
      if (seat === undefined) { render(); return; }
    }

    if (run.seats[seat].ai) {
      Privacy.turnMoved(run.privacy, seat);
      const legal = g.legal(state, seat);
      if (!legal.length) { render(); return; }
      const prof = profileFor(run, seat);
      const think = run.rng.branch(state.moves || run.log.length);
      const action = g.agent(state, seat, legal, prof, think) || legal[0];
      run.busy = true;
      render();
      setTimeout(() => {
        run.busy = false;
        if (!App.run || App.run !== run) return;
        push(run, g.apply(state, action, run.rng));
        step();
      }, 260 + Math.random() * 320);
      return;
    }

    // A person is up. Hand the device over if it needs to change hands.
    const mode = Privacy.turnMoved(run.privacy, seat);
    if (mode === "handoff") run.sealArmed = true;
    render();
  };
  step();
}

function localProfile() {
  const p = store.get("profile", null);
  const fresh = Profile.blank(store.get("myname", "You"));
  const merged = p ? Object.assign(fresh, p) : fresh;
  Profile.expireStreak(merged, Daily.today());
  return merged;
}
function saveProfile(p) { store.set("profile", p); }

function finishGame() {
  const run = App.run;
  if (!run || run.recorded) { App.view = "result"; render(); return; }
  run.recorded = true;
  const me = run.seats.findIndex((x) => !x.ai);
  if (me >= 0) {
    const p = localProfile();
    const secs = Math.round((Date.now() - (run.started || Date.now())) / 1000);
    const fresh = Profile.record(p, {
      gameId: run.g.id, won: run.state.done.winners.includes(me), seconds: secs,
      score: run.state.done.scores[me], metrics: metricsFrom(run.g, run.state, me),
      difficulty: run.difficulty, daily: run.daily ? run.daily.date : null,
      bossId: run.daily ? run.daily.bossId : null,
    });
    saveProfile(p);
    run.earned = fresh;
  }
  App.view = "result";
  render();
}

function act(action) {
  const run = App.run;
  if (!run || run.busy || !Privacy.acceptsInput(run.privacy)) return;
  push(run, run.g.apply(run.state, action, run.rng));
  render();
  settle();
}

/* ── Table ───────────────────────────────────────────────────────── */
/* Both modes render from this. Locally it is read straight out of the
   engine; remotely it arrives already redacted from the server, which is
   the only place the whole state exists. */
function tableModel() {
  const r = App.remote;
  if (r && r.view && (r.view.phase === "playing" || r.view.phase === "over")) {
    const v = r.view;
    return {
      remote: true, t: v.table, hand: v.hand || [], legal: v.legal || [],
      names: v.names || [], seats: v.seats || [], active: v.active,
      viewer: v.you, log: v.log || [], solo: false, busy: false,
      sealed: false, act: sendAction,
    };
  }
  const run = App.run, viewer = Privacy.viewer(run.privacy);
  return {
    remote: false, t: tableFor(run.g, run.state, viewer),
    hand: viewer === null ? [] : B.at(run.state.board, Z.hand(viewer)).map((id) => B.visible(run.state.board, id, viewer)),
    legal: viewer === null ? [] : run.g.legal(run.state, viewer),
    names: run.state.names, seats: run.state.seats, active: run.state.active,
    viewer, log: run.log, solo: !!run.g.solo, busy: run.busy,
    sealed: !Privacy.acceptsInput(run.privacy), act,
  };
}

  const m = tableModel();

  const s = el("div", "table");

    n.append(el("span", "k", c.k), el("span", "v", String(c.v)));

  if (!m.solo) {

    m.seats.forEach((seat, i) => {

      o.append(el("span", "nm", (m.names[seat] || "") + (seat === m.viewer ? " (you)" : "")));
