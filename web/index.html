      ev.push(`${st.names[seat]} melds ${ids.length}.`);
      return this.checkOut(st, seat, ev);
    }
    if (a.t === "layoff") {
      const id = st.sel[seat][0]; st.sel[seat] = [];
      const m = st.melds[a.m];
      B.move(st.board, id, m.zone, "up");
      m.cards.push(id);
      ev.push(`${st.names[seat]} lays off on ${st.names[m.owner]}'s meld.`);
      return this.checkOut(st, seat, ev);
    }
    // discard
    const id = st.sel[seat][0]; st.sel[seat] = [];
    B.move(st.board, id, Z.discard, "up");
    this.checkOut(st, seat, ev);
    if (st.roundOver) return ev;
    st.phase = "draw";
    st.active = nextSeat(st.seats, seat);
    if (!B.count(st.board, Z.stock)) { st.roundOver = true; st.outSeat = null; ev.push("The stock is out."); }
    return ev;
  },
  checkOut(st, seat, ev) {
    if (B.count(st.board, Z.hand(seat)) > 0) return ev;
    st.roundOver = true; st.outSeat = seat;
    ev.push(`${st.names[seat]} goes out.`);
    return ev;
  },
  auto(st, rng) {
    if (st.done || !st.roundOver) return [];
    st.roundOver = false;
    const ev = [];
    const winner = st.outSeat;
    let total = 0;
    for (const s of st.seats) if (s !== winner) total += B.cardsIn(st.board, Z.hand(s)).reduce((n, c) => n + deadwoodPoints(c), 0);
    if (winner !== null && winner !== undefined) {
      st.scores[winner] += total;
      ev.push(`${st.names[winner]} scores ${total}.`);
    } else ev.push("Nobody went out.");
    if (Math.max(...st.seats.map((s) => st.scores[s])) >= st.target) {
      const best = Math.max(...st.seats.map((s) => st.scores[s]));
      st.done = { winners: st.seats.filter((s) => st.scores[s] === best), scores: { ...st.scores }, lowWins: false };
      return ev;
    }
    st.round++;
    const fresh = this.setup({ seats: st.seats.map(() => ({})) }, rng);
    st.board = fresh.board; st.melds = []; st.sel = {}; st.phase = "draw";
    st.active = st.seats[(st.round - 1) % st.seats.length];
    st.outSeat = null;
    ev.push(`Deal ${st.round}.`);
    return ev;
  },
  observe(st, seat) {
    return { hand: B.cardsIn(st.board, Z.hand(seat)), top: B.top(st.board, Z.discard),
      stock: B.count(st.board, Z.stock), melds: st.melds.map((m) => this.meldCards(st, m)),
      counts: st.seats.map((s) => B.count(st.board, Z.hand(s))) };
  },
  agent(st, seat, legal, prof, rng) {
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const top = B.top(st.board, Z.discard);
      const now = Melds.best(hand).points;
      const withIt = top ? Melds.best(hand.concat(top)).points : Infinity;
      const take = legal.find((a) => a.t === "takeDiscard");
      // Take the upcard only when it actually improves the hand.
      if (take && withIt < now - 2) return take;
      return legal.find((a) => a.t === "drawStock") || take;
    }
    const picked = st.sel[seat] || [];
    const cards = picked.map((id) => st.board.cards.get(id));
    if (picked.length >= 3 && Melds.valid(cards)) return legal.find((a) => a.t === "meld");

    /* Commit to one thing per turn — lay a meld down, or throw a card
       away — and see it through. Deciding afresh on every selection is
       how an agent ends up picking a card up and putting it straight
       back down forever. */
    const solution = Melds.best(hand);
    if (!st.intent || st.intent.seat !== seat || !picked.length) {
      const layable = solution.melds.filter((m) => m.length >= 3);
      st.intent = layable.length && rng.chance(.75 + prof.memory * .2)
        ? { seat, kind: "meld", ids: layable[0].map((c) => c.id) }
        : { seat, kind: "discard", id: (solution.deadwood[0] || hand[hand.length - 1]).id };
    }
    const fallback = () => legal.find((a) => a.t === "clear") || legal.find((a) => a.t === "discard") || legal[0];
    if (st.intent.kind === "meld") {
      const want = st.intent.ids.find((id) => !picked.includes(id));
      if (want !== undefined) return legal.find((a) => a.t === "select" && a.id === want) || fallback();
      return legal.find((a) => a.t === "meld") || fallback();
    }
    if (picked.includes(st.intent.id)) {
      const lay = legal.find((a) => a.t === "layoff");
      if (lay && rng.chance(.6 + prof.memory * .3)) return lay;
      return legal.find((a) => a.t === "discard") || fallback();
    }
    if (picked.length) return legal.find((a) => a.t === "clear") || legal[0];
    return legal.find((a) => a.t === "select" && a.id === st.intent.id) || legal[0];
  },

  table(st, viewer) {
    const zones = [
      { label: "Stock", cards: B.count(st.board, Z.stock) ? [{ known: false, id: -11 }] : [], stack: true },
      { label: "Discard", cards: [B.top(st.board, Z.discard)].filter(Boolean).map((c) => ({ known: true, ...c })) },
    ];
    st.melds.forEach((m, i) => zones.push({
      label: `${st.names[m.owner]} · ${i + 1}`,
      cards: this.meldCards(st, m).map((c) => ({ known: true, ...c })), spread: true, small: true,
    }));
    const mine = viewer === null ? null : Melds.best(B.cardsIn(st.board, Z.hand(viewer)));
    return {
      callouts: [
        { k: "Stock", v: B.count(st.board, Z.stock) },
        { k: "Deal", v: st.round },
        ...(mine ? [{ k: "Your deadwood", v: mine.points }] : []),
      ],
      zones,
      counts: (s) => `${B.count(st.board, Z.hand(s))} · ${st.scores[s]}`,
      handHint: st.phase === "draw" ? "Draw from the stock or take the discard"
        : "Tap cards to select — meld them, lay one off, or discard",
      selected: st.sel[viewer] || [],
    };
  },
});

/* ── GIN RUMMY ────────────────────────────────────────────────────── */
def({
  id: "gin", name: "Gin Rummy", tagline: "Knock low. Or go gin.",
  category: "Rummy", min: 2, max: 2, art: ["acid", "ink"],
  setup(cfg, rng) {
    const seats = [0, 1];
    const b = newBoard();
    B.load(b, rng.shuffle(buildDeck()), Z.stock);
    B.ensure(b, [...seats.map(Z.hand), Z.stock, Z.discard]);
    for (let i = 0; i < 10; i++) for (const s of seats) B.draw(b, Z.stock, Z.hand(s), "own", s);
    for (const s of seats) B.sort(b, Z.hand(s), bySuitRank);
    B.draw(b, Z.stock, Z.discard, "up");
    const st = { board: b, seats, active: 1, done: null, phase: "draw", sel: {},
      scores: { 0: 0, 1: 0 }, round: 1, target: 100, knockAt: 10, roundOver: false,
      summary: null, took: null };
    return st;
  },
  legal(st, seat) {
    if (st.done || st.active !== seat || st.roundOver) return [];
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const out = [];
      if (B.count(st.board, Z.stock) > 2) out.push({ t: "drawStock" });
      if (B.count(st.board, Z.discard)) out.push({ t: "takeDiscard" });
      return out;
    }
    const picked = st.sel[seat] || [];
    // The card just taken from the discard cannot go straight back.
    const out = hand.filter((c) => !picked.includes(c.id) && c.id !== st.took)
      .map((c) => ({ t: "select", id: c.id }));
    if (picked.length === 1) {
      out.push({ t: "clear" });
      out.push({ t: "discard" });
      const rest = hand.filter((c) => c.id !== picked[0]);
      const sol = Melds.best(rest);
      if (sol.points <= st.knockAt) out.push({ t: "knock", gin: sol.points === 0 });
    }
    return out;
  },
  apply(st, a, rng) {
    const seat = st.active, ev = [];
    if (a.t === "drawStock") { B.draw(st.board, Z.stock, Z.hand(seat), "own", seat); B.sort(st.board, Z.hand(seat), bySuitRank); st.took = null; st.phase = "discard"; return ev; }
    if (a.t === "takeDiscard") {
      const c = B.draw(st.board, Z.discard, Z.hand(seat), "own", seat);
      B.sort(st.board, Z.hand(seat), bySuitRank);
      st.took = c ? c.id : null; st.phase = "discard";
      if (c) ev.push(`${st.names[seat]} takes the ${RANK_NAME[c.rank].toLowerCase()}.`);
      return ev;
    }
    if (a.t === "select") { st.sel[seat] = [...(st.sel[seat] || []), a.id]; return ev; }
    if (a.t === "clear") { st.sel[seat] = []; return ev; }
    const id = st.sel[seat][0]; st.sel[seat] = [];
    B.move(st.board, id, Z.discard, "up");
    st.took = null;
    if (a.t === "discard") {
      if (B.count(st.board, Z.stock) <= 2) { st.roundOver = true; st.summary = null; ev.push("The stock ran out — washout."); return ev; }
      st.phase = "draw"; st.active = seat === 0 ? 1 : 0;
      return ev;
    }
    // knock
    const other = seat === 0 ? 1 : 0;
    for (const s of st.seats) for (const cid of B.at(st.board, Z.hand(s))) B.face(st.board, cid, "up");
    const mine = Melds.best(B.cardsIn(st.board, Z.hand(seat)));
    let theirs = Melds.best(B.cardsIn(st.board, Z.hand(other)));
    const gin = mine.points === 0;
    let theirPoints = theirs.points;
    if (!gin) {
      // The defender lays off onto the knocker's melds — but not after gin.
      const off = Melds.layOff(theirs.deadwood, mine.melds);
      theirPoints = off.remaining.reduce((n, c) => n + deadwoodPoints(c), 0);
      if (off.laid.length) ev.push(`${st.names[other]} lays off ${off.laid.length}.`);
    }
    const diff = theirPoints - mine.points;
    let winner = seat, points, kind;
    if (gin) { points = theirPoints + 25; kind = "gin"; }
    else if (diff <= 0) { winner = other; points = Math.abs(diff) + 25; kind = "undercut"; }
    else { points = diff; kind = "knock"; }
    st.scores[winner] += points;
    st.summary = { knocker: seat, winner, points, kind, mine: mine.points, theirs: theirPoints };
    ev.push(kind === "gin" ? `${st.names[seat]} goes gin — ${points}.`
      : kind === "undercut" ? `${st.names[other]} undercuts for ${points}.`
      : `${st.names[seat]} knocks for ${points}.`);
    st.roundOver = true;
    return ev;
  },
  auto(st, rng) {
    if (st.done || !st.roundOver) return [];
    st.roundOver = false;
    const ev = [];
    if (Math.max(st.scores[0], st.scores[1]) >= st.target) {
      const best = Math.max(st.scores[0], st.scores[1]);
      st.done = { winners: st.seats.filter((s) => st.scores[s] === best), scores: { ...st.scores }, lowWins: false };
      return ev;
    }
    st.round++;
    const fresh = this.setup({ seats: [{}, {}] }, rng);
    st.board = fresh.board; st.sel = {}; st.phase = "draw"; st.took = null; st.summary = null;
    st.active = st.round % 2 === 0 ? 0 : 1;
    ev.push(`Deal ${st.round}.`);
    return ev;
  },
  observe(st, seat) {
    const other = seat === 0 ? 1 : 0;
    return { hand: B.cardsIn(st.board, Z.hand(seat)), top: B.top(st.board, Z.discard),
      stock: B.count(st.board, Z.stock), opponent: B.count(st.board, Z.hand(other)), scores: st.scores };
  },
  agent(st, seat, legal, prof, rng) {
    const hand = B.cardsIn(st.board, Z.hand(seat));
    if (st.phase === "draw") {
      const top = B.top(st.board, Z.discard);
      const now = Melds.best(hand).points;
      const withIt = top ? Melds.best(hand.concat(top)).points : Infinity;
      const take = legal.find((a) => a.t === "takeDiscard");
      if (take && withIt < now - 1) return take;
      return legal.find((a) => a.t === "drawStock") || take;
    }
    const picked = st.sel[seat] || [];
    if (picked.length === 1) {
      const knock = legal.find((a) => a.t === "knock");
      if (knock) {
        // Always take gin. Knock small otherwise, and more readily when
        // the deal has run long.
        if (knock.gin) return knock;
        const rest = Melds.best(hand.filter((c) => c.id !== picked[0])).points;
        if (rest <= 4 || rng.chance(prof.aggression * .5)) return knock;
      }
      return legal.find((a) => a.t === "discard");
    }
    // Choose the discard that leaves the least deadwood.
    let bestId = null, bestPts = Infinity;
    for (const c of hand) {
      if (c.id === st.took) continue;
      const pts = Melds.best(hand.filter((x) => x.id !== c.id)).points;
      if (pts < bestPts) { bestPts = pts; bestId = c.id; }
    }
    return legal.find((a) => a.t === "select" && a.id === bestId) || legal[0];
  },
  table(st, viewer) {
    const mine = viewer === null ? null : Melds.best(B.cardsIn(st.board, Z.hand(viewer)));
    return {
      callouts: [
        { k: "Stock", v: B.count(st.board, Z.stock) },
        { k: "Deal", v: st.round },
        ...(mine ? [{ k: "Deadwood", v: mine.points }, { k: "Knock at", v: st.knockAt + " or less" }] : []),
      ],
      zones: [
        { label: "Stock", cards: B.count(st.board, Z.stock) ? [{ known: false, id: -12 }] : [], stack: true },
        { label: "Discard", cards: [B.top(st.board, Z.discard)].filter(Boolean).map((c) => ({ known: true, ...c })) },
      ],
      counts: (s) => `${B.count(st.board, Z.hand(s))} · ${st.scores[s]}`,
      handHint: st.phase === "draw" ? "Draw from the stock or take the discard"
        : "Tap the card you want to throw",
      selected: st.sel[viewer] || [],
    };
  },
});

/* ═══════════════════════════════════════════════════════════════════
   PRIVACY — the Pass & Play coordinator.
   Permission is state, not a screen. `viewer` is computed and is null
   for every phase where the device is in transit, so there is no code
   path that renders a hand mid-handoff.
   ═══════════════════════════════════════════════════════════════════ */
const Privacy = {
  make(seats, isHuman) { return { phase: "open", seat: null, next: null, seats, isHuman }; },
  viewer(p) { return p.phase === "playing" || p.phase === "revealing" ? p.seat : null; },
  acceptsInput(p) { return p.phase === "playing"; },
  open(p, seat) {
    if (!p.isHuman(seat)) { p.phase = "playing"; p.seat = seat; return "resume"; }
    const humans = p.seats.filter(p.isHuman);
    if (humans.length <= 1) { p.phase = "playing"; p.seat = seat; return "resume"; }
    p.phase = "handoff"; p.next = seat; return "handoff";
  },
  /* Called when the turn moves. An AI seat, or the same human twice in a
     row, never triggers the ritual — the device has not changed hands. */
  turnMoved(p, seat) {
    if (seat === null || seat === undefined) return "none";
    if (!p.isHuman(seat)) { p.phase = "playing"; p.seat = seat; return "none"; }
    const humans = p.seats.filter(p.isHuman);
    if (humans.length <= 1) { p.phase = "playing"; p.seat = seat; return "none"; }
    if (p.seat === seat && p.phase === "playing") return "none";
    p.phase = "handoff"; p.next = seat; p.seat = null; return "handoff";
  },
  confirm(p) { p.phase = "playing"; p.seat = p.next; p.next = null; },
  shield(p) { if (p.phase === "playing" && p.isHuman(p.seat)) { p.next = p.seat; p.seat = null; p.phase = "handoff"; return true; } return false; },
};

function cardEl(vc, w, opts = {}) {
  const h = Math.round(w / (2.5 / 3.5));
  const n = el("button", "card");
  n.style.width = w + "px"; n.style.height = h + "px";
  n.type = "button";
  n.tabIndex = opts.play ? 0 : -1;
  if (!opts.play) n.style.cursor = "default";
  if (vc.known) {
    if (isRed(vc)) n.classList.add("red");
    const pip = (cls) => {
      const p = el("div", "pip " + cls);
      p.style.fontSize = Math.round(w * .30) + "px";
      p.innerHTML = `${RANK_TOKEN[vc.rank]}<br>${SUIT_GLYPH[vc.suit]}`;
      return p;
    };
    n.append(pip("tl"), pip("br"));
    const mid = el("div", "mid", SUIT_GLYPH[vc.suit]);
    mid.style.fontSize = Math.round(w * .5) + "px";
    n.append(mid);
    n.setAttribute("aria-label", spoken(vc));
  } else {
    n.classList.add("back");
    const m = el("div", "backmark", "◆");
    m.style.fontSize = Math.round(w * .3) + "px";
    n.append(m);
    n.setAttribute("aria-label", "Face-down card");
  }
  if (opts.sel) n.classList.add("sel");
  if (opts.dim) n.classList.add("dim");
  if (opts.playable) n.classList.add("playable");
  if (opts.play) { n.classList.add("play"); n.onclick = opts.play; }
  if (opts.tilt !== undefined) n.style.transform = `rotate(${opts.tilt}deg)`;
  return n;
}
const seededTilt = (id, spread = 3) => {
  const x = Math.sin(id * 12.9898) * 43758.5453;
  return ((x - Math.floor(x)) * 2 - 1) * spread;
};

/* ── Cover art: a seeded screen-print composition per game ───────── */
function coverArt(node, game) {
  const c = el("canvas");
  node.prepend(c);
  const paint = () => {
    const r = node.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);
    const g = c.getContext("2d");
    g.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const ink = css.getPropertyValue("--" + game.art[1]).trim() || "#0E0D0C";
    const hue = css.getPropertyValue("--" + game.art[0]).trim() || "#E33A21";
    g.fillStyle = ink; g.fillRect(0, 0, r.width, r.height);
    const rng = rngFrom(game.id.split("").reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7) >>> 0);
    g.fillStyle = hue;
    // A sprayed field, then two overprinted card shapes: press, not gradient.
    for (let i = 0; i < 90; i++) {
      const a = rng() * Math.PI * 2, d = Math.pow(rng(), 1.6) * r.width * .75;
      g.globalAlpha = .10 + rng() * .16;
      g.beginPath();
      g.arc(r.width * .68 + Math.cos(a) * d, r.height * .35 + Math.sin(a) * d * .7, 1 + rng() * 5, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;
    for (let i = 0; i < 2; i++) {
      const w = r.width * .34, h = w / (2.5 / 3.5);
      g.save();
      g.translate(r.width * (.66 + i * .13), r.height * (.30 + i * .06));
      g.rotate((i ? 13 : -9) * Math.PI / 180);
      g.fillStyle = i ? hue : css.getPropertyValue("--cream").trim();
      g.globalAlpha = i ? .95 : .18;
      g.beginPath();
      const rr = 6;
      g.roundRect(-w / 2, -h / 2, w, h, rr);
      g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
  };
  paint();
  new ResizeObserver(paint).observe(node);
}

      chip.style.background = seat.ai ? `var(--${CAST.find((c) => c.id === seat.ai).colour})` : "";
      const input = el("input");
      input.value = seat.name; input.setAttribute("aria-label", `Player ${i + 1} name`);
      input.oninput = () => { seat.name = input.value; };
      const swap = el("button", "icon-btn", seat.ai ? "👤" : "🤖");
      swap.title = seat.ai ? "Make this a person" : "Make this an opponent";
      swap.onclick = () => {
        if (seat.ai) { seat.ai = null; seat.name = "Player " + (i + 1); }
        else { const p = CAST[i % CAST.length]; seat.ai = p.id; seat.name = p.name; }
        drawSeats();
      };
      row.append(chip, input);
      if (!g.solo) row.append(swap);
      if (seats.length > g.min && !g.solo) {
        const rm = el("button", "icon-btn", "−");
        rm.title = "Remove"; rm.onclick = () => { seats.splice(i, 1); drawSeats(); };
        row.append(rm);
      }
      list.append(row);
    });
    if (seats.length < g.max) {
      const add = el("button", "btn ghost wide", "Add player");
      add.onclick = () => {
        const i = seats.length;
        const p = CAST[i % CAST.length];
        seats.push({ name: p.name, ai: p.id });
        drawSeats();
      };
      list.append(add);
    }
  };
  drawSeats();

  const diffField = el("div", "field");
  let difficulty = store.get("difficulty", "skilled");
  const seg = el("div", "seg");
  for (const d of ["casual", "skilled", "expert"]) {
    const b = el("button", null, d);
    b.setAttribute("aria-pressed", String(d === difficulty));
    b.onclick = () => { difficulty = d; store.set("difficulty", d); [...seg.children].forEach((c) => c.setAttribute("aria-pressed", String(c.textContent === d))); };
    seg.append(b);
  }
  diffField.append(el("div", "label", "Opponent skill"), seg);

  const start = el("button", "btn wide", "Deal");
  start.onclick = () => {
    const names = seats.map((x, i) => (x.name || "").trim() || `Player ${i + 1}`);
    store.set("seats." + g.id, seats.map((x, i) => ({ name: names[i], ai: x.ai })));
    startGame(g, seats.map((x, i) => ({ name: names[i], ai: x.ai })), difficulty);
  };

  refreshNote();

  wrap.append(head, field, ...(g.solo ? [] : [diffField]), el("div", "stack"), note, start);
  s.append(wrap);
  return s;
}
function defaultSeats(g) {
  const n = Math.min(Math.max(g.min, g.solo ? 1 : Math.min(4, g.max)), g.max);
  const out = [{ name: store.get("myname", "You"), ai: null }];
  for (let i = 1; i < n; i++) { const p = CAST[(i - 1) % CAST.length]; out.push({ name: p.name, ai: p.id }); }
  return out;
}

/* ── Running a game ──────────────────────────────────────────────── */
function startGame(g, seats, difficulty) {
  const seed = (Math.random() * 0xFFFFFFFF) >>> 0;
  const rng = rngFrom(seed);
  const state = g.setup({ seats }, rng);
  state.names = seats.map((s) => s.name);
  const isHuman = (i) => !seats[i].ai;
  App.run = {
    g, seed, rng, state, seats, difficulty,
    privacy: Privacy.make(state.seats, isHuman),
    log: [], busy: false, sealArmed: false,
  };
  store.set("myname", seats.find((s) => !s.ai)?.name || "You");
  const first = state.active;
  const mode = Privacy.open(App.run.privacy, first === null || first === undefined ? state.seats[0] : first);
  App.run.sealArmed = mode === "handoff";
  App.view = "table";
  render();
  settle();
}

function profileFor(run, seat) {
  const p = CAST.find((c) => c.id === run.seats[seat].ai) || CAST[0];
  return { ...p, mistake: Math.max(0, p.mistake + DIFFICULTY[run.difficulty]) };
}

function push(run, events) {
  for (const e of events) if (e) run.log.push(e);
  if (run.log.length > 40) run.log.splice(0, run.log.length - 40);
}

/* Runs everything that happens without a person deciding: automatic
   scoring, dealing, AI turns. Stops the moment a human is on the clock. */
function settle() {
  const run = App.run;
  if (!run || run.busy) return;
  const { g, state } = run;
  let guard = 0;
  const step = () => {
    if (!App.run || App.run !== run) return;
    if (state.done) { finishGame(); return; }
    if (guard++ > 4000) return;

    if (g.auto) {
      const ev = g.auto(state, run.rng);
      if (ev.length) { push(run, ev); render(); run.busy = true; setTimeout(() => { run.busy = false; step(); }, 420); return; }
    }
    if (state.done) { finishGame(); return; }

    const seat = state.active;
    if (seat === null || seat === undefined) { render(); return; }

    if (run.seats[seat].ai) {
      Privacy.turnMoved(run.privacy, seat);
      const legal = g.legal(state, seat);
      if (!legal.length) { render(); return; }
      const prof = profileFor(run, seat);
      const think = run.rng.branch(state.moves || run.log.length);
      const action = g.agent(state, seat, legal, prof, think) || legal[0];
      run.busy = true;
      render();
      setTimeout(() => {
        run.busy = false;
        if (!App.run || App.run !== run) return;
        push(run, g.apply(state, action, run.rng));
        step();
      }, 260 + Math.random() * 320);
      return;
    }

    // A person is up. Hand the device over if it needs to change hands.
    const mode = Privacy.turnMoved(run.privacy, seat);
    if (mode === "handoff") run.sealArmed = true;
    render();
  };
  step();
}

function finishGame() {
  const run = App.run;
  if (!run || run.recorded) { App.view = "result"; render(); return; }
  run.recorded = true;
  const stats = store.get("stats", {});
  const s = stats[run.g.id] = stats[run.g.id] || { played: 0, won: 0 };
  s.played++;
  const me = run.seats.findIndex((x) => !x.ai);
  if (me >= 0 && run.state.done.winners.includes(me)) s.won++;
  store.set("stats", stats);
  App.view = "result";
  render();
}

function act(action) {
  const run = App.run;
  if (!run || run.busy || !Privacy.acceptsInput(run.privacy)) return;
  push(run, run.g.apply(run.state, action, run.rng));
  render();
  settle();
}

/* ── Table ───────────────────────────────────────────────────────── */
function viewTable() {
  const run = App.run;
  const { g, state, privacy } = run;
  const viewer = Privacy.viewer(privacy);
  const t = g.table(state, viewer);
  const s = el("div", "table");

  const co = el("div", "callouts");
  for (const c of t.callouts || []) {
    const n = el("div", "callout");
    n.append(el("span", "k", c.k), el("span", "v", String(c.v)));
    co.append(n);
  }
  s.append(co);

  if (!g.solo) {
    const opp = el("div", "opponents");
    for (const seat of state.seats) {
      const o = el("div", "opp" + (state.active === seat ? " active" : ""));
      o.append(el("span", "nm", state.names[seat]));
      o.append(el("span", "ct", t.counts ? t.counts(seat) : ""));
      opp.append(o);
    }
    s.append(opp);
  }

  const felt = el("div", "felt");
  if (t.tableau) felt.append(tableauView(run, t));
  else {
    const zs = el("div", "zones");
    for (const z of t.zones || []) {
      const zn = el("div", "zone");
      const pile = el("div", "pile row");
      pile.style.gap = z.spread ? "6px" : "0";
      if (!z.cards.length) { pile.classList.add("empty"); pile.style.width = "56px"; pile.style.height = "78px"; }
      z.cards.forEach((vc, i) => {
        const c = cardEl(vc, 56, { tilt: z.spread ? seededTilt(vc.id ?? i, 4) : 0 });
        if (!z.spread && i) c.style.marginLeft = "-40px";
        pile.append(c);
      });
      if (z.action) { pile.style.cursor = "pointer"; pile.onclick = () => act(z.action); }
      zn.append(pile);
      if (z.label) zn.append(el("div", "zlabel", z.label));
      zs.append(zn);
    }
    felt.append(zs);
  }
  s.append(felt);

  if (run.log.length) {
    const lg = el("div", "log");
    for (const line of run.log.slice(-3)) lg.append(el("div", null, line));
    s.append(lg);
  }

  s.append(handbar(run, t, viewer));
  return s;
}

function handbar(run, t, viewer) {
  const { g, state } = run;
  const bar = el("div", "handbar");
  const legal = viewer === null ? [] : g.legal(state, viewer);
  const canAct = Privacy.acceptsInput(run.privacy) && !run.busy && legal.length > 0;

  if (t.handHint && canAct) bar.append(el("div", "label", t.handHint));

  if (viewer !== null) {
    const hand = B.at(state.board, Z.hand(viewer)).map((id) => B.visible(state.board, id, viewer));
    const wrapH = el("div", "hand");
    const n = hand.length || 1;
    const w = Math.max(40, Math.min(62, Math.floor((Math.min(window.innerWidth - 40, 560) - 20) / Math.max(4, n) + 16)));
    const overlap = n > 7 ? -Math.round(w * .42) : n > 5 ? -Math.round(w * .22) : 4;
    hand.forEach((vc, i) => {
      const selected = (t.selected || []).includes(vc.id);
      const playable = t.noCardPlay ? false
        : t.askMode ? legal.some((a) => a.t === "ask" && a.rank === vc.rank)
        : legal.some((a) => a.id === vc.id);
      const dim = t.dimUnplayable && vc.known ? t.dimUnplayable(vc) : false;
      const c = cardEl(vc, w, {
        sel: selected, dim: dim && !playable, playable: playable && canAct,
        tilt: selected ? 0 : seededTilt(vc.id, 2),
        play: canAct && playable ? () => {
          if (t.askMode) { askFor(run, vc.rank); return; }
          const a = legal.find((x) => x.id === vc.id);
          if (a) act(a);
        } : null,
      });
      if (i) c.style.marginLeft = overlap + "px";
      c.style.zIndex = String(i);
      wrapH.append(c);
    });
    if (hand.length) bar.append(wrapH);
  }

  const acts = el("div", "actions");
  const seen = new Set();
  for (const a of legal) {
    if (a.id !== undefined && !t.noCardPlay) continue;
    const label = actionLabel(g, state, a);
    if (!label || seen.has(label)) continue;
    seen.add(label);
    const b = el("button", "btn" + (a.t === "fold" || a.t === "pass" || a.t === "believe" ? " ghost" : ""), label);
    b.disabled = !canAct;
    b.onclick = () => act(a);
    acts.append(b);
  }
  if (acts.children.length) bar.append(acts);

  if (viewer === null && !run.sealArmed && !run.busy) {
    bar.append(el("div", "label", "Waiting…"));
  }
  return bar;
}

function actionLabel(g, st, a) {
  switch (a.t) {
    case "play": return g.id === "president" || g.id === "cheat" ? "Play selected" : null;
    case "lay": return "Put them down";
    case "select": return null;
    case "clear": return "Clear";
    case "draw": return g.id === "klondike" ? "Turn" : "Draw a card";
    case "drawStock": return "Draw from stock";
    case "takeDiscard": return "Take the discard";
    case "meld": return "Meld these";
    case "layoff": return "Lay off";
    case "discard": return "Discard";
    case "knock": return a.gin ? "Gin!" : "Knock";
    case "redeal": return "Turn the pile over";
    case "pass": return "Pass";
    case "confirmPass": return "Pass these three";
    case "suit": return SUIT_GLYPH[a.suit] + " " + SUIT_NAME[a.suit];
    case "believe": return "Believe them";
    case "challenge": return "Call it";
    case "flip": return "Flip";
    case "ok": return "Continue";
    case "refill": return "Draw back in";
    case "check": return "Check";
    case "fold": return "Fold";
    case "call": return `Call ${a.amount}`;
    case "raise": return `Raise to ${a.amount + (st.committed[st.active] || 0)}`;
    case "allin": return `All in (${a.amount})`;
    case "ask": return null;
    case "move": return null;
    default: return null;
  }
}

/* Go Fish asks a person, so tapping a rank opens the choice of who. */
function askFor(run, rank) {
  const { g, state } = run;
  const viewer = Privacy.viewer(run.privacy);
  const targets = g.legal(state, viewer).filter((a) => a.t === "ask" && a.rank === rank);
  if (!targets.length) return;
  if (targets.length === 1) return act(targets[0]);
  const sheet = el("div", "seal");
  sheet.style.background = "var(--ground)";
  sheet.style.color = "var(--on-ground)";
  sheet.append(el("div", "eyebrow", `Asking for ${RANK_NAME[rank].toLowerCase()}s`));
  sheet.append(el("h2", "poster h-m", "Who has them?"));
  const list = el("div", "stack"); list.style.gap = "var(--s2)";
  for (const a of targets) {
    const b = el("button", "btn wide", state.names[a.target]);
    b.onclick = () => { sheet.remove(); act(a); };
    list.append(b);
  }
  const cancel = el("button", "btn ghost wide", "Never mind");
  cancel.onclick = () => sheet.remove();
  sheet.append(list, cancel);
  document.body.append(sheet);
}

/* ── Klondike tableau ────────────────────────────────────────────── */
function tableauView(run, t) {
  const { g, state } = run;
  const wrapT = el("div", "stack");
  wrapT.style.gap = "var(--s4)";
  wrapT.style.width = "100%";

  const top = el("div", "row");
  top.style.cssText = "gap:var(--s3);justify-content:space-between;width:100%;flex-wrap:wrap";
  for (const z of t.zones) {
    const zn = el("div", "zone");
    const pile = el("div", "pile");
    if (!z.cards.length) { pile.classList.add("empty"); pile.style.width = "44px"; pile.style.height = "62px"; }
    z.cards.forEach((vc) => {
      const isSel = run.pick === vc.id;
      pile.append(cardEl(vc, 44, {
        sel: isSel,
        play: z.pick || z.foundation !== undefined ? () => selectOrMove(run, vc, z) : null,
      }));
    });
    if (z.action) { pile.style.cursor = "pointer"; pile.onclick = () => act(z.action); }
    if (z.foundation !== undefined && !z.cards.length) pile.onclick = () => selectOrMove(run, null, z);
    zn.append(pile);
    if (z.label) zn.append(el("div", "zlabel", z.label));
    top.append(zn);
  }
  wrapT.append(top);

  const cols = el("div", "row");
  cols.style.cssText = "gap:4px;align-items:flex-start;width:100%;justify-content:center";
  for (let col = 0; col < 7; col++) {
    const c = el("div", "stack");
    c.style.cssText = "gap:0;min-width:40px;align-items:center";
    const ids = B.at(state.board, Z.tableau(col));
    if (!ids.length) {
      const slot = el("div", "pile empty");
      slot.style.cssText = "width:40px;height:56px";
      slot.onclick = () => selectOrMove(run, null, { tab: col });
      c.append(slot);
    }
    ids.forEach((id, i) => {
      const vc = B.visible(state.board, id, 0);
      const n = cardEl(vc, 40, {
        sel: run.pick === id,
        play: () => selectOrMove(run, vc.known ? vc : { id }, { tab: col }),
      });
      if (i) n.style.marginTop = state.board.up.has(id) ? "-38px" : "-46px";
      n.style.zIndex = String(i);
      c.append(n);
    });
    cols.append(c);
  }
  wrapT.append(cols);
  return wrapT;
}
function selectOrMove(run, vc, z) {
  const { g, state } = run;
  const legal = g.legal(state);
  if (run.pick !== null && run.pick !== undefined) {
    const to = z.foundation !== undefined ? Z.foundation(z.foundation) : Z.tableau(z.tab);
    const m = legal.find((a) => a.t === "move" && a.id === run.pick && a.to === to);
    run.pick = null;
    if (m) { act(m); return; }
    render(); return;
  }
  if (!vc || !vc.known) { render(); return; }
  const any = legal.some((a) => a.t === "move" && a.id === vc.id);
  run.pick = any ? vc.id : null;
  if (!any) toast("That card has nowhere to go.");
  render();
}

/* ── The seal ────────────────────────────────────────────────────── */
function viewSeal() {
  const run = App.run;
  const name = run.state.names[run.privacy.next];
  const s = el("div", "seal armed");
  s.append(el("div", "eyebrow", "Pass the device"));
  const who = el("h1", "poster who", name);
  s.append(who);
  s.append(el("p", "note", "Everything from the last turn has been cleared. Hand the device over before you tap."));
  const b = el("button", "btn", `I'm ${name}`);
  b.onclick = () => {
    Privacy.confirm(run.privacy);
    run.sealArmed = false;
    render();
    settle();
  };
  s.append(b);
  return s;
}

/* ── Result ──────────────────────────────────────────────────────── */
function viewResult() {
  const run = App.run;
  const { state } = run;
  const d = state.done;
  const s = el("div", "screen result");
  const wrap = el("div", "wrap stack");
  wrap.style.gap = "var(--s6)";

  const me = run.seats.findIndex((x) => !x.ai);
  const iWon = me >= 0 && d.winners.includes(me);
  const banner = el("div", "banner stack");
  banner.style.gap = "var(--s3)";
  banner.append(el("div", "label", run.g.name));
  const headline = d.winners.length > 1
    ? "Split."
    : me >= 0 ? (iWon ? "You win." : `${state.names[d.winners[0]]} wins.`)
      : `${state.names[d.winners[0]]} wins.`;
  const h = el("h1", "poster h-xl", headline);
  if (iWon) h.style.color = "var(--accent)";
  banner.append(h);

  const tbl = el("table", "scoretable");
  const head = el("tr");
  head.append(el("th", null, "Player"), el("th", null, d.lowWins ? "Points (low wins)" : "Score"));
  tbl.append(head);
  const order = [...state.seats].sort((a, b) => d.lowWins ? (d.scores[a] - d.scores[b]) : (d.scores[b] - d.scores[a]));
  for (const seat of order) {
    const tr = el("tr", d.winners.includes(seat) ? "win" : "");
    tr.append(el("td", null, state.names[seat]), el("td", null, String(d.scores[seat])));
    tbl.append(tr);
  }

  const again = el("button", "btn wide", "Play again");
  again.onclick = () => startGame(run.g, run.seats, run.difficulty);
  const back = el("button", "btn ghost wide", "Back to the library");
  back.onclick = () => { App.run = null; App.view = "library"; render(); };

  wrap.append(banner, tbl, el("div", "stack"), again, back);
  s.append(wrap);
  return s;
}

/* ── Render ──────────────────────────────────────────────────────── */
function render() {
  try { renderInner(); }
  catch (err) {
    console.error(err);
    screen.innerHTML = "";
    const s = el("div", "screen");
    const w = el("div", "wrap stack");
    w.style.gap = "var(--s4)";
    w.append(el("h1", "poster h-m", "That screen did not open."));
    const p = el("p", "label");
    p.textContent = String((err && err.message) || err);
    const b = el("button", "btn wide", "Back to the library");
    b.onclick = () => { App.run = null; App.game = null; App.view = "library"; render(); };
    w.append(p, b);
    s.append(w);
    screen.append(s);
  }
}
function renderInner() {
  const run = App.run;
  const inGame = !!run && App.view === "table";
  document.getElementById("quitBtn").classList.toggle("hidden", !inGame && App.view !== "setup");
  document.querySelectorAll(".seal").forEach((n) => n.remove());
  screen.innerHTML = "";
  if (App.view === "setup" && App.game) { screen.append(viewSetup()); return; }
  if (!run) { App.view = "library"; screen.append(viewLibrary()); return; }
  if (App.view === "result") { screen.append(viewResult()); return; }
  screen.append(viewTable());
  if (run.sealArmed) document.body.append(viewSeal());
}
render();

/* Backgrounding the app re-seals it: coming back needs another
   confirmation, because we cannot know who is holding it now. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "hidden") return;
  const run = App.run;
  if (!run || App.view !== "table") return;
  if (Privacy.shield(run.privacy)) { run.sealArmed = true; render(); }
});
window.addEventListener("resize", () => { if (App.run && App.view === "table") render(); });
</script>
