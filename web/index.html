  }

  const felt = el("div", "felt" + (t.tableau ? " tableau" : ""));
  if (t.tableau && !m.remote) felt.append(tableauView(App.run, t));
  else {
    const zs = el("div", "zones");
    for (const z of t.zones || []) {
      const zn = el("div", "zone");
      const pile = el("div", "pile row");
      pile.style.gap = z.spread ? "6px" : "0";
      if (!z.cards.length) { pile.classList.add("empty"); pile.style.width = "56px"; pile.style.height = "78px"; }
      z.cards.forEach((vc, i) => {
        const c = cardEl(vc, 56, { tilt: z.spread ? seededTilt(vc.id ?? i, 4) : 0 });
        if (!z.spread && i) c.style.marginLeft = "-40px";
        pile.append(c);
      });
      if (z.action) { pile.style.cursor = "pointer"; pile.onclick = () => m.act(z.action); }
      zn.append(pile);
      if (z.label) zn.append(el("div", "zlabel", z.label));
      zs.append(zn);
    }
    felt.append(zs);
  }
  s.append(felt);

  if (m.log.length) {
    const lg = el("div", "log");
    for (const line of m.log.slice(-3)) lg.append(el("div", null, line));
    s.append(lg);
  }
  if (m.remote && m.active !== m.viewer && m.active !== null) {
    s.append(el("div", "label", `Waiting for ${m.names[m.active] || "the next player"}…`));
  }

  s.append(handbar(m));
  return s;
}

function handbar(m) {
  const t = m.t, legal = m.legal, viewer = m.viewer;
  const bar = el("div", "handbar");
  const canAct = !m.sealed && !m.busy && legal.length > 0;

  if (t.handHint && canAct) bar.append(el("div", "label", t.handHint));

  if (viewer !== null) {
    const hand = m.hand;
    const wrapH = el("div", "hand");
    const n = hand.length || 1;
    const w = Math.max(40, Math.min(62, Math.floor((Math.min(window.innerWidth - 40, 560) - 20) / Math.max(4, n) + 16)));
    const overlap = n > 7 ? -Math.round(w * .42) : n > 5 ? -Math.round(w * .22) : 4;
    hand.forEach((vc, i) => {
      const selected = (t.selected || []).includes(vc.id);
      const playable = t.noCardPlay ? false
        : t.askMode ? legal.some((a) => a.t === "ask" && a.rank === vc.rank)
        : legal.some((a) => a.id === vc.id);
      const dim = (t.dimIds || []).includes(vc.id);
      const c = cardEl(vc, w, {
        sel: selected, dim: dim && !playable, playable: playable && canAct,
        tilt: selected ? 0 : seededTilt(vc.id, 2),
        play: canAct && playable ? () => {
          if (t.askMode) { askFor(m, vc.rank); return; }
          const a = legal.find((x) => x.id === vc.id);
          if (a) m.act(a);
        } : null,
      });
      if (i) c.style.marginLeft = overlap + "px";
      c.style.zIndex = String(i);
      wrapH.append(c);
    });
    if (hand.length) bar.append(wrapH);
  }

  const acts = el("div", "actions");
  const seen = new Set();
  const gameId = m.remote ? (App.remote.view.gameId || "") : App.run.g.id;
  for (const a of legal) {
    if (a.id !== undefined && !t.noCardPlay) continue;
    const label = actionLabel(gameId, m, a);
    if (!label || seen.has(label)) continue;
    seen.add(label);
    const b = el("button", "btn" + (a.t === "fold" || a.t === "pass" || a.t === "believe" ? " ghost" : ""), label);
    b.disabled = !canAct;
    b.onclick = () => m.act(a);
    acts.append(b);
  }
  if (acts.children.length) bar.append(acts);
  return bar;
}

function actionLabel(gameId, m, a) {
  switch (a.t) {
    case "play": return gameId === "president" || gameId === "cheat" ? "Play selected" : null;
    case "lay": return "Put them down";
    case "select": return null;
    case "clear": return "Clear";
    case "draw": return gameId === "klondike" ? "Turn" : "Draw a card";
    case "drawStock": return "Draw from stock";
    case "takeDiscard": return "Take the discard";
    case "meld": return "Meld these";
    case "layoff": return "Lay off";
    case "discard": return "Discard";
    case "knock": return a.gin ? "Gin!" : "Knock";
    case "redeal": return "Turn the pile over";
    case "pass": return "Pass";
    case "confirmPass": return "Pass these three";
    case "suit": return SUIT_GLYPH[a.suit] + " " + SUIT_NAME[a.suit];
    case "believe": return "Believe them";
    case "challenge": return "Call it";
    case "flip": return "Flip";
    case "ok": return "Continue";
    case "refill": return "Draw back in";
    case "check": return "Check";
    case "fold": return "Fold";
    case "call": return `Call ${a.amount}`;
    case "raise": return `Raise to ${a.amount}`;
    case "allin": return `All in (${a.amount})`;
    case "ask": return null;
    case "move": return null;
    default: return null;
  }
}

/* Go Fish asks a person, so tapping a rank opens the choice of who. */
function askFor(m, rank) {
  const targets = m.legal.filter((a) => a.t === "ask" && a.rank === rank);
  if (!targets.length) return;
  if (targets.length === 1) return m.act(targets[0]);
  const sheet = el("div", "seal");
  sheet.style.background = "var(--ground)";
  sheet.style.color = "var(--on-ground)";
  sheet.append(el("div", "eyebrow", `Asking for ${RANK_NAME[rank].toLowerCase()}s`));
  sheet.append(el("h2", "poster h-m", "Who has them?"));
  const list = el("div", "stack"); list.style.gap = "var(--s2)";
  for (const a of targets) {
    const b = el("button", "btn wide", m.names[a.target] || `Player ${a.target + 1}`);
    b.onclick = () => { sheet.remove(); m.act(a); };
    list.append(b);
  }
  const cancel = el("button", "btn ghost wide", "Never mind");
  cancel.onclick = () => sheet.remove();
  sheet.append(list, cancel);
  document.body.append(sheet);
}

/* ── Solitaire tableau ───────────────────────────────────────────── */
/* Klondike lays out seven columns, FreeCell eight and Spider ten, and
   they all have to fit whatever screen you are holding. Everything below
   is sized from the real viewport rather than assumed. */
function tableauView(run, t) {
  const { g, state } = run;
  const nCols = t.columns || 7;
  const wrapT = el("div", "stack");
  wrapT.style.gap = "var(--s4)";
  wrapT.style.width = "100%";

  const room = Math.min(window.innerWidth, 620) - 76;   // table and felt padding
  const gap = nCols > 8 ? 3 : 4;
  const colW = Math.max(26, Math.min(46, Math.floor((room - (nCols - 1) * gap) / nCols)));
  const colH = Math.round(colW / (2.5 / 3.5));
  const topN = Math.max(1, t.zones.length);
  const topGap = topN > 6 ? 6 : 10;
  const topW = Math.max(24, Math.min(44, Math.floor((room - (topN - 1) * topGap) / topN)));

  const top = el("div", "row");
  top.style.cssText = `gap:${topGap}px;justify-content:center;align-items:flex-start;width:100%;flex-wrap:wrap`;
  for (const z of t.zones) {
    const zn = el("div", "zone");
    const pile = el("div", "pile");
    if (!z.cards.length) {
      pile.classList.add("empty");
      pile.style.width = topW + "px";
      pile.style.height = Math.round(topW / (2.5 / 3.5)) + "px";
    }
    z.cards.forEach((vc) => {
      const isSel = run.pick === vc.id;
      pile.append(cardEl(vc, topW, {
        sel: isSel,
        play: z.pick || z.foundation !== undefined ? () => selectOrMove(run, vc, z) : null,
      }));
    });
    if (z.action) { pile.style.cursor = "pointer"; pile.onclick = () => act(z.action); }
    if (z.foundation !== undefined && !z.cards.length) pile.onclick = () => selectOrMove(run, null, z);
    zn.append(pile);
    if (z.label) zn.append(el("div", "zlabel", z.label));
    top.append(zn);
  }
  wrapT.append(top);

  /* Ten narrow columns still beat a phone on its narrowest edge, so the
     row scrolls sideways rather than losing the columns off the end. */
  const cols = el("div", "row");
  // A sideways scroller clips vertically too, so leave the lifted-card
  // travel inside it as padding rather than losing the top of a card.
  cols.style.cssText = "width:100%;overflow-x:auto;overflow-y:hidden;padding:18px 0 6px;margin-top:-18px";
  const track = el("div", "row");
  const spread = nCols * colW + (nCols - 1) * gap;
  track.style.cssText = `gap:${gap}px;align-items:flex-start;padding-bottom:4px;` +
    (spread <= room ? "margin:0 auto" : "margin:0");
  for (let col = 0; col < nCols; col++) {
    const c = el("div", "stack");
    c.style.cssText = `gap:0;min-width:${colW}px;align-items:center`;
    const ids = B.at(state.board, Z.tableau(col));
    if (!ids.length) {
      const slot = el("div", "pile empty");
      slot.style.cssText = `width:${colW}px;height:${colH}px`;
      slot.onclick = () => selectOrMove(run, null, { tab: col });
      c.append(slot);
    }
    ids.forEach((id, i) => {
      const vc = B.visible(state.board, id, 0);
      const n = cardEl(vc, colW, {
        sel: run.pick === id,
        play: () => selectOrMove(run, vc.known ? vc : { id }, { tab: col }),
      });
      // A face-up card shows its index; a face-down one only needs an edge.
      if (i) n.style.marginTop = -Math.round(colH * (state.board.up.has(id) ? .68 : .82)) + "px";
      n.style.zIndex = String(i);
      c.append(n);
    });
    track.append(c);
  }
  cols.append(track);
  wrapT.append(cols);
  return wrapT;
}
function selectOrMove(run, vc, z) {
  const { g, state } = run;
  const legal = g.legal(state);
  if (run.pick !== null && run.pick !== undefined) {
    const to = z.foundation !== undefined ? Z.foundation(z.foundation) : Z.tableau(z.tab);
    const m = legal.find((a) => a.t === "move" && a.id === run.pick && a.to === to);
    run.pick = null;
    if (m) { act(m); return; }
    render(); return;
  }
  if (!vc || !vc.known) { render(); return; }
  const any = legal.some((a) => a.t === "move" && a.id === vc.id);
  run.pick = any ? vc.id : null;
  if (!any) toast("That card has nowhere to go.");
  render();
}

/* ── The seal ────────────────────────────────────────────────────── */
function viewSeal() {
  const run = App.run;
  const name = run.state.names[run.privacy.next];
  const s = el("div", "seal armed");
  s.append(el("div", "eyebrow", "Pass the device"));
  const who = el("h1", "poster who", name);
  s.append(who);
  s.append(el("p", "note", "Everything from the last turn has been cleared. Hand the device over before you tap."));
  const b = el("button", "btn", `I'm ${name}`);
  b.onclick = () => {
    Privacy.confirm(run.privacy);
    run.sealArmed = false;
    render();
    settle();
  };
  s.append(b);
  return s;
}

/* ── Result ──────────────────────────────────────────────────────── */
function viewResult() {
  const r = App.remote;
  if (r && r.view && r.view.phase === "over") return viewRemoteResult(r.view);
  const run = App.run;
  const { state } = run;
  const d = state.done;
  const s = el("div", "screen result");
  const wrap = el("div", "wrap stack");
  wrap.style.gap = "var(--s6)";

  const me = run.seats.findIndex((x) => !x.ai);
  const iWon = me >= 0 && d.winners.includes(me);
  const banner = el("div", "banner stack");
  banner.style.gap = "var(--s3)";
  banner.append(el("div", "label", run.g.name));
  const headline = d.winners.length > 1
    ? "Split."
    : me >= 0 ? (iWon ? "You win." : `${state.names[d.winners[0]]} wins.`)
      : `${state.names[d.winners[0]]} wins.`;
  const h = el("h1", "poster h-xl", headline);
  if (iWon) h.style.color = "var(--accent)";
  banner.append(h);

  const tbl = el("table", "scoretable");
  const head = el("tr");
  head.append(el("th", null, "Player"), el("th", null, d.lowWins ? "Points (low wins)" : "Score"));
  tbl.append(head);
  const order = [...state.seats].sort((a, b) => d.lowWins ? (d.scores[a] - d.scores[b]) : (d.scores[b] - d.scores[a]));
  for (const seat of order) {
    const tr = el("tr", d.winners.includes(seat) ? "win" : "");
    tr.append(el("td", null, state.names[seat]), el("td", null, String(d.scores[seat])));
    tbl.append(tr);
  }

  const again = el("button", "btn wide", "Play again");
  again.onclick = () => startGame(run.g, run.seats, run.difficulty);
  const back = el("button", "btn ghost wide", "Back to the library");
  back.onclick = () => { App.run = null; App.view = "library"; render(); };

  wrap.append(banner, tbl, el("div", "stack"), again, back);
  s.append(wrap);
  return s;
}

function viewRemoteResult(v) {
  const d = v.done;
  const s = el("div", "screen result");
  const wrap = el("div", "wrap stack");
  wrap.style.gap = "var(--s6)";
  const iWon = d.winners.includes(v.you);
  const banner = el("div", "banner stack");
  banner.style.gap = "var(--s3)";
  banner.append(el("div", "label", v.gameName || ""));
  const headline = d.winners.length > 1 ? "Split."
    : iWon ? "You win." : `${v.names[d.winners[0]]} wins.`;
  const h = el("h1", "poster h-xl", headline);
  if (iWon) h.style.color = "var(--accent)";
  banner.append(h);

  const tbl = el("table", "scoretable");
  const head = el("tr");
  head.append(el("th", null, "Player"), el("th", null, d.lowWins ? "Points (low wins)" : "Score"));
  tbl.append(head);
  const order = [...v.seats].sort((a, b) => d.lowWins ? (d.scores[a] - d.scores[b]) : (d.scores[b] - d.scores[a]));
  for (const seat of order) {
    const tr = el("tr", d.winners.includes(seat) ? "win" : "");
    tr.append(el("td", null, v.names[seat] + (seat === v.you ? " (you)" : "")), el("td", null, String(d.scores[seat])));
    tbl.append(tr);
  }

  const back = el("button", "btn wide", v.host ? "Back to the table" : "Back to the table");
  back.onclick = () => { App.view = "lobby"; render(); };
  const leave = el("button", "btn ghost wide", "Leave");
  leave.onclick = () => { Net.leave(); App.view = "library"; render(); };
  wrap.append(banner, tbl, el("div", "stack"), back, leave);
  s.append(wrap);
  return s;
}

/* ── Render ──────────────────────────────────────────────────────── */
function render() {
  try { renderInner(); }
  catch (err) {
    console.error(err);
    screen.innerHTML = "";
    const s = el("div", "screen");
    const w = el("div", "wrap stack");
    w.style.gap = "var(--s4)";
    w.append(el("h1", "poster h-m", "That screen did not open."));
    const p = el("p", "label");
    p.textContent = String((err && err.message) || err);
    const b = el("button", "btn wide", "Back to the library");
    b.onclick = () => { App.run = null; App.game = null; App.view = "library"; render(); };
    w.append(p, b);
    s.append(w);
    screen.append(s);
  }
}
function renderInner() {
  const run = App.run, rem = App.remote;
  const inGame = (!!run && App.view === "table") || App.view === "setup";
  document.getElementById("quitBtn").classList.toggle("hidden", !inGame);
  document.querySelectorAll(".seal").forEach((n) => n.remove());
  screen.innerHTML = "";

  if (App.view === "stats") { screen.append(viewStats()); return; }
  if (App.view === "daily") { screen.append(viewDaily()); return; }
  if (App.view === "connect") { screen.append(viewConnect()); return; }
  if (App.view === "lobby" && rem) { screen.append(viewLobby()); return; }
  if (rem && rem.view && App.view === "result") { screen.append(viewResult()); return; }
  if (rem && rem.view && rem.view.phase === "playing" && App.view === "table") { screen.append(viewTable()); return; }

  if (App.view === "setup" && App.game) { screen.append(viewSetup()); return; }
  if (!run) { App.view = "library"; screen.append(viewLibrary()); return; }
  if (App.view === "result") { screen.append(viewResult()); return; }
  screen.append(viewTable());
  if (run.sealArmed) document.body.append(viewSeal());
}
render();

/* A reload should put you back in the seat you were in, not out of the
   game — the server keeps the seat and the token identifies it. */
if (SERVED) {
  const saved = store.get("table", null);
  if (saved && saved.code && saved.token) {
    Net.post("/api/join", { code: saved.code, token: saved.token, name: store.get("myname", "Player") })
      .then((r) => {
        App.remote = { code: r.code, token: r.token, view: null };
        App.view = "lobby"; render();
        Net.open(r.code, r.token);
      })
      .catch(() => store.set("table", null));
  }
}

/* Backgrounding the app re-seals it: coming back needs another
   confirmation, because we cannot know who is holding it now. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "hidden") return;
  const run = App.run;
  if (!run || App.view !== "table") return;
  if (Privacy.shield(run.privacy)) { run.sealArmed = true; render(); }
});
window.addEventListener("resize", () => { if (App.run && App.view === "table") render(); });
</script>
